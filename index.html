<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpinWheel - Customizable Picker Wheel</title>

  <!-- PWA Manifest & Meta Tags -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpinWheel">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Tailwind CSS with Dark Mode Config -->
  <script src="scripts/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="scripts/react.production.min.js"></script>
  <script crossorigin src="scripts/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="scripts/babel.min.js"></script>

  <!-- Load CSS -->
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <!-- Loading Screen -->
  <div id="app-loader"
    class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-gradient-to-b from-sky-300 to-blue-200 transition-opacity duration-500">
    <!-- Sun -->
    <div
      class="absolute top-10 right-10 w-20 h-20 bg-yellow-400 rounded-full shadow-[0_0_40px_rgba(251,191,36,0.8)] animate-pulse">
    </div>

    <!-- Content -->
    <div class="relative z-10 flex flex-col items-center mb-16">
      <!-- Bouncing Ball -->
      <div class="w-24 h-24" style="animation: beachBounce 1.2s infinite;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full drop-shadow-xl">
          <circle cx="256" cy="256" r="256" fill="#4f46e5" />
          <path d="M256 256 256 0 A256 256 0 0 1 477.7 128 Z" fill="#fbbf24" />
          <path d="M256 256 477.7 128 A256 256 0 0 1 477.7 384 Z" fill="#ec4899" />
          <path d="M256 256 477.7 384 A256 256 0 0 1 256 512 Z" fill="#10b981" />
          <path d="M256 256 256 512 A256 256 0 0 1 34.3 384 Z" fill="#3b82f6" />
          <path d="M256 256 34.3 384 A256 256 0 0 1 34.3 128 Z" fill="#8b5cf6" />
          <path d="M256 256 34.3 128 A256 256 0 0 1 256 0 Z" fill="#ef4444" />
          <circle cx="256" cy="256" r="40" fill="#fff" />
        </svg>
      </div>
      <!-- Shadow on sand/ground -->
      <div class="w-16 h-2 bg-black rounded-full blur-sm mt-4" style="animation: shadowScale 1.2s infinite;"></div>

      <h2 class="mt-6 text-blue-900 font-bold text-xl tracking-[0.3em] uppercase drop-shadow-sm animate-pulse">
        Loading...</h2>
    </div>

    <!-- Sand / Beach -->
    <div class="absolute bottom-0 w-full h-1/5 bg-[#f3dcb3] border-t-8 border-[#e3c38e]"></div>

    <!-- Simple Ocean Waves -->
    <div class="absolute bottom-[18%] w-full h-4 bg-blue-400/30 rounded-t-full blur-md transform scale-110"></div>
  </div>

  <div id="root"></div>

  <!-- Load Resources (Inline Icons, Themes, Animations, etc.) -->
  <script type="text/babel" src="scripts/icons.js"></script>
  <script type="text/babel" src="scripts/themes.js"></script>
  <script type="text/javascript" src="scripts/animations.js"></script>
  <script type="text/javascript" src="scripts/sounds.js"></script>
  <script type="text/javascript" src="scripts/utils.js"></script>
  <script type="text/javascript" src="scripts/achievements.js"></script>

  <!-- Load Components (Toast, etc.) -->
  <script type="text/babel" src="scripts/components/Modal.js"></script>
  <script type="text/babel" src="scripts/components/Toast.js"></script>
  <script type="text/babel" src="scripts/components/OutOfOrderOverlay.js"></script>

  <!-- Load App -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const apiKey = ""; // Provided by environment

    const App = () => {
      const defaultItems = [
        "Pizza", "Burger", "Sushi", "Chicken Sate", "Gado-Gado", "Pasta", "Yakiniku", "Ramen", "Pad Thai", "Sandwich", "Fried Rice"
      ];

      // --- STATE MANAGEMENT ---

      // Load states from localStorage or defaults
      // We now manage a list of lists.
      // Legacy migration: if 'spinWheel_inputs' exists but 'spinWheel_savedLists' doesn't, migrate it.
      const [savedLists, setSavedLists] = useState(() => {
        const storedLists = loadState('spinWheel_savedLists', null);
        if (storedLists) return storedLists;

        // Migration / Default
        const legacyInput = loadState('spinWheel_inputs', null);
        const initialContent = legacyInput !== null ? legacyInput : defaultItems.join('\n');

        return [{
          id: 'default',
          name: 'Lunch Ideas',
          content: initialContent
        }];
      });

      const [activeListId, setActiveListId] = useState(() => loadState('spinWheel_activeListId', 'default'));

      // Helper to get content safely
      const getActiveListContent = (lists, id) => {
        const list = lists.find(l => l.id === id);
        return list ? list.content : '';
      };

      // Initialize input text from the active list, NOT direct localStorage
      const [inputText, setInputText] = useState(getActiveListContent(savedLists, activeListId));

      // Items is now an array of objects: { text: string, weight: number }
      const [items, setItems] = useState(() => parseItems(inputText));

      const [history, setHistory] = useState(() => {
        const storedHistory = loadState('spinWheel_history', []);
        // Rehydrate timestamp strings back to Date objects
        return storedHistory.map(item => ({
          ...item,
          timestamp: new Date(item.timestamp)
        }));
      });
      const [soundEnabled, setSoundEnabled] = useState(() => loadState('spinWheel_sound', true));
      const [theme, setTheme] = useState(() => loadState('spinWheel_theme', 'auto'));
      const [spinDuration, setSpinDuration] = useState(() => loadState('spinWheel_duration', 10000));
      const [hideLabels, setHideLabels] = useState(() => loadState('spinWheel_hideLabels', false));
      const [aiVoiceEnabled, setAiVoiceEnabled] = useState(() => loadState('spinWheel_aiVoice', false));
      const [geminiApiKey, setGeminiApiKey] = useState(() => loadState('spinWheel_apiKey', ''));

      // Color Settings
      const [colorSettings, setColorSettings] = useState(() => loadState('spinWheel_colorSettings', {
        type: 'default',
        customColors: '#FF6B6B, #4ECDC4, #45B7D1'
      }));

      // New: Color Assignment Mode (Dynamic vs Deterministic)
      const [colorAssignment, setColorAssignment] = useState(() => loadState('spinWheel_colorAssignment', 'dynamic'));

      const [activeColors, setActiveColors] = useState(defaultColors);

      const [isSpinning, setIsSpinning] = useState(false);
      const [winner, setWinner] = useState(null);
      const [showThemeMenu, setShowThemeMenu] = useState(false);
      const [showShareMenu, setShowShareMenu] = useState(false);
      const [showSettingsMenu, setShowSettingsMenu] = useState(false);
      const [showListDropdown, setShowListDropdown] = useState(false);
      const [showColorModal, setShowColorModal] = useState(false);
      const [shareUrl, setShareUrl] = useState('');
      const [activeTab, setActiveTab] = useState('inputs'); // 'inputs', 'history', or 'progress'
      const [isCopied, setIsCopied] = useState(false);
      const [showGenModal, setShowGenModal] = useState(false);
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [showApiKeyModal, setShowApiKeyModal] = useState(false); // New: API Key Modal
      const [genPrompt, setGenPrompt] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [tempApiKey, setTempApiKey] = useState(''); // For editing key

      // Temp state for color editing
      const [tempColorType, setTempColorType] = useState('default');
      const [tempCustomColors, setTempCustomColors] = useState('');

      // Power Meter State
      const [isCharging, setIsCharging] = useState(false);
      const [chargePower, setChargePower] = useState(0);
      const [isOutOfOrder, setIsOutOfOrder] = useState(false); // NEW: Broken state
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      // Toast State (Queue System)
      const [toastQueue, setToastQueue] = useState([]);

      const addToast = (message, duration = 5000, icon = null) => {
        let title = "Notification";
        if (message.startsWith("Level Up!")) title = "Level Up!";
        else if (message.startsWith("Achievement Unlocked")) title = "Achievement Unlocked";

        setToastQueue(prev => [...prev, { message, duration, title, icon, id: Date.now() + Math.random() }]);
      };

      const closeToast = () => {
        setToastQueue(prev => prev.slice(1));
      };

      // XP System State
      const [xp, setXp] = useState(() => loadState('spinWheel_xp', 0));
      const [sessionXP, setSessionXP] = useState(0); // Track XP earned in this session (not persisted)
      const [totalSpins, setTotalSpins] = useState(() => loadState('spinWheel_totalSpins', 0)); // Track total spins
      const [achievements, setAchievements] = useState([]); // Store achievement objects with status
      const [achievementFilter, setAchievementFilter] = useState('all'); // 'all', 'unlocked', 'locked'

      // Track Tab Views for "Lorekeeper's Review"
      const [inputsTabViews, setInputsTabViews] = useState(() => loadState('spinWheel_inputsTabViews', 0));
      const [historyTabViews, setHistoryTabViews] = useState(() => loadState('spinWheel_historyTabViews', 0));
      const [progressTabViews, setProgressTabViews] = useState(() => loadState('spinWheel_progressTabViews', 0));

      // Initialize Achievement Manager
      const achievementManager = useMemo(() => new window.AchievementManager(), []);

      // Load initial achievements
      useEffect(() => {
        setAchievements(achievementManager.getAll());
      }, []);

      // Helper to handle achievement unlocks and XP gain
      const handleAchievementUnlocks = (newUnlocks) => {
        if (newUnlocks.length > 0) {
          let totalBonusXp = 0;
          newUnlocks.forEach(ach => {
            const xpMsg = ach.bonusXp ? ` (+${ach.bonusXp} XP)` : '';
            addToast(`Achievement Unlocked: ${ach.title}${xpMsg}`, 5000, ach.icon);
            if (ach.bonusXp) totalBonusXp += ach.bonusXp;
          });

          setAchievements(achievementManager.getAll());

          if (totalBonusXp > 0) {
            setXp(prev => prev + totalBonusXp);
          }
        }
      }; const levelInfo = getLevelProgress(xp);

      // Level Up Toast Logic
      const prevLevelRef = useRef(levelInfo.level);

      useEffect(() => {
        if (levelInfo.level > prevLevelRef.current) {
          addToast(`Level Up! You are now ${getLevelTitle(levelInfo.level)}!`, 5000);
          // Optional: Trigger confetti if not already triggered by something else
          // fireConfetti();
        }
        prevLevelRef.current = levelInfo.level;
      }, [levelInfo.level]);

      // REFS
      const chargeIntervalRef = useRef(null);
      const pressTimerRef = useRef(null); // New ref for Tap vs Hold detection
      const isChargingRef = useRef(false); // Ref to track charging status synchronously
      const chargePowerRef = useRef(0);    // Ref to track power synchronously
      const overchargeRef = useRef(0);     // Track how long we've been overcharged (ms)
      const smokeContainerRef = useRef(null); // Container for smoke particles
      const canvasRef = useRef(null);
      const rotationRef = useRef(0);
      const isSpinningRef = useRef(false); // Tracks spin status synchronously
      const removingItemRef = useRef(null); // Tracks item being removed for animation
      const itemsRef = useRef(items);
      const colorsRef = useRef(defaultColors); // Ref for colors to be used in animation loop
      const velocityRef = useRef(0);
      const winnerRef = useRef(null);
      const isDarkModeRef = useRef(false);
      const themeMenuRef = useRef(null);
      const shareMenuRef = useRef(null);
      const settingsMenuRef = useRef(null);
      const spinFrameRef = useRef(null); // Capture requestAnimationFrame ID
      const hideLabelsRef = useRef(hideLabels);
      const pointerRef = useRef(null); // Ref for the arrow pointer
      const listDropdownRef = useRef(null); // Ref for list dropdown
      const isOutOfOrderRef = useRef(isOutOfOrder); // Ref for out of order state
      const colorAssignmentRef = useRef(colorAssignment); // Ref for color assignment mode
      const idleVelocityRef = useRef(0); // Tracks current idle rotation speed for gradual acceleration

      // Audio Refs
      const audioCtxRef = useRef(null);
      const lastTickRef = useRef(0);
      const chargeOscillatorRef = useRef(null); // Ref for the charging sound oscillator
      const chargeGainRef = useRef(null);       // Ref for the charging sound volume
      const chargeFilterRef = useRef(null);     // Ref for the charging sound lowpass filter

      // Achievement Tracking Refs
      const spinTimestampsRef = useRef([]); // Track spins for "Analysis Paralysis"
      const themeToggleTimestampsRef = useRef([]); // Track theme toggles for "Light Switch Rave"
      const consecutiveOverheatsRef = useRef(0); // Track consecutive overheats for "This Is Fine"
      const usedAIRef = useRef(false); // Track if AI was used for "Ghost in the Machine"

      // State to force re-render for relative time updates
      const [, setTick] = useState(0);

      // Calculate custom preview colors in real-time for the modal
      const customColorPreview = useMemo(() => {
        if (!tempCustomColors) return [];
        // Clean input and extract valid hex codes
        const cleaned = tempCustomColors.replace(/[\[\]"']/g, '');
        return cleaned.split(/[\n,]+/)
          .map(c => c.trim())
          .filter(c => /^#([0-9A-F]{3}){1,2}$/i.test(c));
      }, [tempCustomColors]);

      const isCustomColorInvalid = tempCustomColors.trim().length > 0 && customColorPreview.length === 0;

      // Sync isOutOfOrder ref
      useEffect(() => {
        isOutOfOrderRef.current = isOutOfOrder;
      }, [isOutOfOrder]);

      // PWA Install Prompt Listener
      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      // Interval to update relative times every 30 seconds
      useEffect(() => {
        const timer = setInterval(() => {
          setTick(t => t + 1);
        }, 30000);
        return () => clearInterval(timer);
      }, []);

      // Initialize from URL parameters if present
      // MODIFIED: Import as new list
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const encodedList = params.get('list');
        if (encodedList) {
          try {
            const decodedList = decodeURIComponent(escape(atob(encodedList)));

            // Create new imported list
            const newList = {
              id: Date.now().toString(),
              name: `Imported List ${new Date().toISOString()}`,
              content: decodedList
            };

            setSavedLists(prev => [...prev, newList]);
            setActiveListId(newList.id);
            setInputText(decodedList);

            // Clean URL without reloading
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({ path: newUrl }, '', newUrl);

            // Track unique imports for "Loot Box"
            const importedCodes = loadState('spinWheel_importedCodes', []);
            let uniqueCount = importedCodes.length;
            if (!importedCodes.includes(encodedList)) {
              importedCodes.push(encodedList);
              localStorage.setItem('spinWheel_importedCodes', JSON.stringify(importedCodes));
              uniqueCount = importedCodes.length;
            }

            // Check for "Foreign Exchange" and "Loot Box" achievements
            const newUnlocks = achievementManager.check({
              importedList: true,
              uniqueImportCount: uniqueCount
            });
            handleAchievementUnlocks(newUnlocks);
          } catch (e) {
            console.error("Failed to decode list from URL", e);
          }
        }
      }, []);

      // List Persistence Effects
      useEffect(() => {
        localStorage.setItem('spinWheel_savedLists', JSON.stringify(savedLists));
      }, [savedLists]);

      useEffect(() => {
        localStorage.setItem('spinWheel_activeListId', JSON.stringify(activeListId));
      }, [activeListId]);

      // Auto-save content to current list when typing
      useEffect(() => {
        setSavedLists(prev => prev.map(list =>
          list.id === activeListId ? { ...list, content: inputText } : list
        ));
      }, [inputText]);

      // Switch content when active ID changes
      useEffect(() => {
        const content = getActiveListContent(savedLists, activeListId);
        setInputText(content);
      }, [activeListId]);

      useEffect(() => {
        localStorage.setItem('spinWheel_history', JSON.stringify(history));
      }, [history]);

      useEffect(() => {
        localStorage.setItem('spinWheel_sound', JSON.stringify(soundEnabled));
      }, [soundEnabled]);

      useEffect(() => {
        localStorage.setItem('spinWheel_theme', JSON.stringify(theme));
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('spinWheel_duration', JSON.stringify(spinDuration));
      }, [spinDuration]);

      useEffect(() => {
        localStorage.setItem('spinWheel_hideLabels', JSON.stringify(hideLabels));
      }, [hideLabels]);

      useEffect(() => {
        localStorage.setItem('spinWheel_aiVoice', JSON.stringify(aiVoiceEnabled));
      }, [aiVoiceEnabled]);

      useEffect(() => {
        localStorage.setItem('spinWheel_apiKey', JSON.stringify(geminiApiKey));
      }, [geminiApiKey]);

      useEffect(() => {
        localStorage.setItem('spinWheel_colorSettings', JSON.stringify(colorSettings));
      }, [colorSettings]);

      useEffect(() => {
        localStorage.setItem('spinWheel_xp', JSON.stringify(xp));
      }, [xp]);

      useEffect(() => {
        localStorage.setItem('spinWheel_totalSpins', JSON.stringify(totalSpins));
      }, [totalSpins]);

      // Color Logic
      useEffect(() => {
        let newColors = defaultColors;
        if (colorSettings.type === 'beach') {
          newColors = beachColors;
        } else if (colorSettings.type === 'custom') {
          // Parse the custom string
          const cleaned = colorSettings.customColors.replace(/[\[\]"']/g, ''); // Remove potential JSON formatting chars
          const parsed = cleaned.split(/[\n,]+/).map(c => c.trim()).filter(c => c.match(/^#([0-9A-F]{3}){1,2}$/i));
          if (parsed.length > 0) {
            newColors = parsed;
          }
        }
        setActiveColors(newColors);
        colorsRef.current = newColors;
      }, [colorSettings]);

      const saveColors = () => {
        // Prevent saving invalid state
        if (tempColorType === 'custom' && tempCustomColors.trim().length > 0 && customColorPreview.length === 0) {
          alert("Please enter at least one valid hex color code.");
          return;
        }

        setColorSettings({
          type: tempColorType,
          customColors: tempCustomColors
        });
        setShowColorModal(false);
      };

      // Sync items ref for the animation loop & Update Items State
      useEffect(() => {
        const parsed = parseItems(inputText);
        setItems(parsed);
        itemsRef.current = parsed;
      }, [inputText]);

      // Sync spinning ref
      useEffect(() => {
        isSpinningRef.current = isSpinning;
      }, [isSpinning]);

      // Sync winner ref
      useEffect(() => {
        winnerRef.current = winner;
      }, [winner]);

      // Sync hide labels ref
      useEffect(() => {
        hideLabelsRef.current = hideLabels;
      }, [hideLabels]);

      // Sync color assignment ref & persist
      useEffect(() => {
        colorAssignmentRef.current = colorAssignment;
        localStorage.setItem('spinWheel_colorAssignment', JSON.stringify(colorAssignment));
      }, [colorAssignment]);

      // Theme Logic
      useEffect(() => {
        const root = window.document.documentElement;
        const checkSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = false;

        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'light') {
          isDark = false;
        } else {
          isDark = checkSystemTheme();
        }

        if (isDark) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        isDarkModeRef.current = isDark;

        // Track Theme Toggles for "Light Switch Rave"
        const now = Date.now();
        // Filter toggles within last 10 seconds
        themeToggleTimestampsRef.current = [...themeToggleTimestampsRef.current, now].filter(t => now - t < 10000);

        if (themeToggleTimestampsRef.current.length >= 10) {
          const newUnlocks = achievementManager.check({
            rapidThemeToggles: themeToggleTimestampsRef.current.length
          });
          handleAchievementUnlocks(newUnlocks);
        }
      }, [theme]);

      // Track Tab Views
      useEffect(() => {
        if (activeTab === 'inputs') {
          setInputsTabViews(prev => {
            const newVal = prev + 1;
            localStorage.setItem('spinWheel_inputsTabViews', JSON.stringify(newVal));
            return newVal;
          });
        } else if (activeTab === 'history') {
          setHistoryTabViews(prev => {
            const newVal = prev + 1;
            localStorage.setItem('spinWheel_historyTabViews', JSON.stringify(newVal));
            return newVal;
          });
        } else if (activeTab === 'progress') {
          setProgressTabViews(prev => {
            const newVal = prev + 1;
            localStorage.setItem('spinWheel_progressTabViews', JSON.stringify(newVal));
            return newVal;
          });
        }
      }, [activeTab]);

      // Check Lorekeeper Achievement
      useEffect(() => {
        const newUnlocks = achievementManager.check({
          inputsTabViews: inputsTabViews,
          historyTabViews: historyTabViews,
          progressTabViews: progressTabViews
        });
        handleAchievementUnlocks(newUnlocks);
      }, [inputsTabViews, historyTabViews, progressTabViews]);

      // Click outside to close dropdowns
      useEffect(() => {
        const handleClickOutside = (event) => {
          if (themeMenuRef.current && !themeMenuRef.current.contains(event.target)) {
            setShowThemeMenu(false);
          }
          if (shareMenuRef.current && !shareMenuRef.current.contains(event.target)) {
            setShowShareMenu(false);
          }
          if (settingsMenuRef.current && !settingsMenuRef.current.contains(event.target)) {
            setShowSettingsMenu(false);
          }
          if (listDropdownRef.current && !listDropdownRef.current.contains(event.target)) {
            setShowListDropdown(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
        };
      }, []);

      // Remove Loader logic
      useEffect(() => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          // Check if the app loaded quickly (e.g., from cache)
          // performance.now() returns milliseconds since navigation start
          const loadTime = performance.now();
          const isFastLoad = loadTime < 800; // Threshold: 800ms

          if (isFastLoad) {
            // If loaded fast, remove immediately (skip animation)
            loader.style.display = 'none';
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          } else {
            // If loaded slower (fresh load), fade out smoothly to mask the initialization
            loader.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 500);
          }
        }
      }, []);

      // List Management Handlers
      const handleCreateList = () => {
        const newId = Date.now().toString();
        let counter = 1;
        while (savedLists.some(l => l.name === `Untitled ${counter}`)) {
          counter++;
        }

        const newList = {
          id: newId,
          name: `Untitled ${counter}`,
          content: ''
        };

        setSavedLists(prev => [...prev, newList]);
        setActiveListId(newId);

        // Check "One Small Step" (List Count >= 2) and "Data Hoarder" (List Count >= 10)
        // We need to wait for state update or pass expected length
        const expectedLength = savedLists.length + 1;
        const newUnlocks = achievementManager.check({
          listCount: expectedLength
        });
        handleAchievementUnlocks(newUnlocks);
      };

      const handleDeleteList = () => {
        if (savedLists.length <= 1) {
          if (confirm("This is your only list. Clear it instead?")) {
            setInputText("");
          }
          return;
        }

        if (confirm("Are you sure you want to delete this list?")) {
          const newLists = savedLists.filter(l => l.id !== activeListId);
          setSavedLists(newLists);
          setActiveListId(newLists[0].id);
        }
      };

      const handleRenameList = (newName) => {
        setSavedLists(prev => prev.map(list =>
          list.id === activeListId ? { ...list, name: newName } : list
        ));
      };

      const handleInstallClick = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setDeferredPrompt(null);
        }
      };

      const getThemeIcon = () => {
        if (theme === 'auto') return <MonitorIcon size={24} />;
        if (theme === 'light') return <SunIcon size={24} />;
        return <MoonIcon size={24} />;
      };

      const handleOpenShare = () => {
        if (!showShareMenu) {
          try {

        const now = Date.now();
        spinTimestampsRef.current = [...spinTimestampsRef.current, now].filter(t => now - t < 60000); // Keep last minute

        const baseSpeed = Math.random() * 0.2 + 0.5;
        // CHANGED: Adjusted scaling to allow much slower speeds (5% to 100% instead of 20% to 100%)
        velocityRef.current = baseSpeed * (0.05 + 0.95 * powerFactor);

        const maxDuration = spinDuration;
        // CHANGED: Reduced minimum duration from 2000ms to 500ms for quick nudges
        const targetDuration = Math.max(500, maxDuration * powerFactor);
        const stopThreshold = 0.0001;
        const totalFrames = targetDuration / 16.667;
        const baseFriction = Math.pow(stopThreshold / velocityRef.current, 1 / totalFrames);

        let lastTime = performance.now();

        const animateSpin = (currentTime) => {
          const dt = currentTime - lastTime;
          lastTime = currentTime;
          const frameRatio = dt / 16.67;
          velocityRef.current *= Math.pow(baseFriction, frameRatio);

          if (velocityRef.current < 0.05 && velocityRef.current > 0.001) {
            const wobble = Math.sin(currentTime / 50) * (velocityRef.current * 0.15);
            rotationRef.current += wobble;
          }

          rotationRef.current += velocityRef.current * frameRatio;

          // --- TICK SOUND LOGIC ---
          const NUM_PINS = 30;
          const pinSpacing = (2 * Math.PI) / NUM_PINS;

          const currentStep = Math.floor(rotationRef.current / pinSpacing);
          const lastStep = Math.floor(lastTickRef.current / pinSpacing);

          if (currentStep !== lastStep) {
            window.playTickSound(audioCtxRef, soundEnabled);
          }
          lastTickRef.current = rotationRef.current;

          if (velocityRef.current > stopThreshold) {
            spinFrameRef.current = requestAnimationFrame(animateSpin);
          } else {
            velocityRef.current = 0;

            // CHANGED: Update Ref synchronously
            isSpinningRef.current = false;
            setIsSpinning(false);

            calculateWinner(rotationRef.current);
          }
        };
        spinFrameRef.current = requestAnimationFrame(animateSpin);
      };

      const handleStopSpin = () => {
        if (spinFrameRef.current) {
          cancelAnimationFrame(spinFrameRef.current);
          spinFrameRef.current = null;
        }
        // CHANGED: Update Ref synchronously
        isSpinningRef.current = false;
        setIsSpinning(false);

        velocityRef.current = 0;
      };

      const calculateWinner = (finalRotation) => {
        const normalizedRotation = finalRotation % (2 * Math.PI);

        // Weighted Winner Calculation
        // 1. Calculate effective angle (Right side is 0, moves counter-clockwise relative to rotation)
        let effectiveAngle = (2 * Math.PI - normalizedRotation) % (2 * Math.PI);
        if (effectiveAngle < 0) effectiveAngle += 2 * Math.PI;

        // 2. Calculate total weight
        const currentItems = itemsRef.current;
        const totalWeight = currentItems.reduce((sum, item) => sum + item.weight, 0);

        // 3. Iterate to find which slice encompasses the effectiveAngle
        let accumulatedAngle = 0;
        let winItem = null;

        for (let i = 0; i < currentItems.length; i++) {
          const item = currentItems[i];
          const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);

          if (effectiveAngle >= accumulatedAngle && effectiveAngle < accumulatedAngle + sliceAngle) {
            winItem = item.text;
            break;
          }
          accumulatedAngle += sliceAngle;
        }

        // Fallback (should mostly not happen unless float precision error)
        if (!winItem && currentItems.length > 0) winItem = currentItems[currentItems.length - 1].text;

        setWinner(winItem);

        // Add to history
        setHistory(prev => {
          const newHistory = [{
            id: Date.now(),
            text: winItem,
            timestamp: new Date()
          }, ...prev];
          return newHistory;
        });

        // Award XP
        setXp(prev => prev + 1);
        setSessionXP(prev => prev + 1); // Track session XP
        setTotalSpins(prev => prev + 1);

        // Check Achievements
        // We need the NEW total spins and level.
        // Since state updates are async, we calculate expected values.
        const newTotalSpins = totalSpins + 1;
        const newSessionXP = sessionXP + 1;
        // Level might change if XP crosses threshold.
        // Current XP is `xp`, new is `xp + 1`.
        const newLevelInfo = getLevelProgress(xp + 1);

        // Check for consecutive wins
        // History has the NEWEST result at index 0 (after update).
        // But here `history` state is stale until next render.
        // We can check `winItem` against the PREVIOUS history item.
        const lastResult = history.length > 0 ? history[0].text : null;
        // Check for 3 in a row for "Deja Vu"
        let consecutiveWins = 1; // Start with 1 (current win)
        for (let i = 0; i < history.length; i++) {
          if (history[i].text === winItem) {
            consecutiveWins++;
          } else {
            break;
          }
        }

        // Calculate weights for "Never Tell Me The Odds" and "The House Always Wins"
        // const currentItems = itemsRef.current; // Already defined above
        const winnerObj = currentItems.find(i => i.text === winItem);
        const winnerWeight = winnerObj ? winnerObj.weight : 1;
        const maxWeight = Math.max(...currentItems.map(i => i.weight));
        const maxItemLength = Math.max(...currentItems.map(i => i.text.length));
        const allIdentical = currentItems.length > 0 && currentItems.every(item => item.text === currentItems[0].text);

          spins: newTotalSpins,
          level: newLevelInfo.level,
          sessionXP: newSessionXP,
          consecutiveWins: consecutiveWins,
          hasSpun: true,
          itemCount: currentItems.length,
          spinsInLastMinute: spinTimestampsRef.current.length,
          winnerWeight: winnerWeight,
          maxWeight: maxWeight,
          maxItemLength: maxItemLength,
          allIdentical: allIdentical,

          listCount: savedLists.length,

        });

            unlockedCount: Object.keys(achievementManager.getUnlocked()).length
          });
          handleAchievementUnlocks(metaUnlocks);

            announceWinner(winItem); // Call Gemini TTS only if enabled and key exists
          }
        }

          fireConfetti();
        }
      };

                      <p className="text-sm text-gray-600 dark:text-gray-300 mb-8 italic">
                        We turn caffeine into code and panic into features, all proudly debugged with console.log. ☕😱💻🔍🚀
                      </p>
                    </>
                  ) : winner === '@about' ? (
                    <>
                      {/* About Easter Egg */}
                      <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500"></div>
                      <div className="mx-auto w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mb-4 text-blue-600 dark:text-blue-400">
                        <ScrollIcon size={32} />
                      </div>
                      <h3 className="text-gray-500 dark:text-gray-400 uppercase tracking-widest text-xs font-bold mb-2">The Secret Origin</h3>
                      <div className="text-2xl font-black text-gray-800 dark:text-white mb-4 break-words">
                        Why does this exist?
                      </div>
                      <div className="text-sm text-gray-600 dark:text-gray-300 mb-8 leading-relaxed text-left space-y-4 max-h-60 overflow-y-auto pr-2">
                        <p>
                          Originally developed by the Samuel Kripto technical team to solve a very real operational crisis: choosing the next weekly meeting host without triggering mass avoidance behavior. Manual selection had become an undeniable productivity sink, often followed by five minutes of awkward silence, sudden bursts of “urgent” typing, and at least one person staring intently at logs that absolutely did not require immediate attention.
                        </p>
                        <p>
                          Over time, the process evolved into something resembling a workplace survival game. Cameras mysteriously turned off, microphones instantly muted, and several team members perfected the art of blending into the background like highly trained corporate chameleons. In extreme cases, strategic “BRB” bathroom breaks were deployed the moment the question “Who wants to host next week?” appeared.
                        </p>
                        <p>
                          To restore order (and dignity), this wheel was built. A tool of fairness, efficiency, and cold, impartial randomness—because if fate chooses the host, at least no one can be blamed.
                        </p>
                      </div>
                    </>
                  ) : (
                    <>
                      {/* Standard Winner */}
                      <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                      <div className="mx-auto w-16 h-16 bg-yellow-100 dark:bg-yellow-900/30 rounded-full flex items-center justify-center mb-4 text-yellow-600 dark:text-yellow-500">
                        <TrophyIcon size={32} />
                      </div>
                      <h3 className="text-gray-500 dark:text-gray-400 uppercase tracking-widest text-sm font-bold mb-2">We have a winner!</h3>
                      <div className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 mb-8 break-words">
                        {winner}
                      </div>
                    </>
                  )}

                  <div className="grid grid-cols-1 gap-3">
                    <button
                      onClick={() => setWinner(null)}
                      className="w-full py-3 bg-gray-900 dark:bg-gray-700 text-white rounded-xl font-bold hover:bg-gray-800 dark:hover:bg-gray-600 transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                    >
                      Close
                    </button>
                    <button
                      onClick={() => {
                        // Remove winner logic with animation
                        const winnerIndex = items.findIndex(i => i.text === winner);
                        if (winnerIndex !== -1) {
                          removingItemRef.current = {
                            index: winnerIndex,
                            text: winner,
                            startTime: Date.now(),
                            duration: 750 // 0.75 seconds
                          };
                          setWinner(null);
                          // Ensure loop continues if it was paused (though idle spin usually handles it)
                          // If idle spin is disabled or something, we might need to kick it.
                          // But our idle spin logic now checks removingItemRef, so it should auto-start/continue.
                        } else {
                          // Fallback if not found
                          const newItems = items.filter(i => i.text !== winner);
                          setInputText(itemsToString(newItems));
                          setWinner(null);
                        }

                        // Check "One More Time" achievement
                        const newUnlocks = achievementManager.check({
                          usedRemoveAndSpin: true
                        });
                        handleAchievementUnlocks(newUnlocks);
                      }}
                      className="w-full py-3 bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 rounded-xl font-bold hover:border-red-200 dark:hover:border-red-800 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition"
                    >
                      Remove & Spin Again
                    </button>
                  </div>
                </div>
              </div>
            )
          }

          {/* Color Settings Modal */}
          <Modal
            isOpen={showColorModal}
            onClose={() => setShowColorModal(false)}
            title="Customize Wheel Colors"
            icon={<PaletteIcon size={20} />}
            footer={
              <div className="flex justify-end space-x-2">
                <button onClick={() => setShowColorModal(false)} className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                <button
                  onClick={saveColors}
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                >
                  Save Colors
                </button>
              </div>
            }
          >
            <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
              {/* Option: Default */}
              <label className={`flex items-start p-3 rounded-lg border cursor-pointer transition ${tempColorType === 'default' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : 'border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50'}`}>
                <input
                  type="radio"
                  name="colorType"
                  checked={tempColorType === 'default'}
                  onChange={() => setTempColorType('default')}
                  className="mt-1 mr-3"
                />
                <div>
                  <span className="block font-medium text-gray-800 dark:text-white">Default Rainbow</span>
                  <span className="text-xs text-gray-500 dark:text-gray-400">The standard colorful palette.</span>
                  <div className="flex mt-2 space-x-1">
                    {defaultColors.map(c => (
                      <div key={c} className="w-4 h-4 rounded-full" style={{ backgroundColor: c }}></div>
                    ))}
                  </div>
                </div>
              </label>

              {/* Option: Beach */}
              <label className={`flex items-start p-3 rounded-lg border cursor-pointer transition ${tempColorType === 'beach' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : 'border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50'}`}>
                <input
                  type="radio"
                  name="colorType"
                  checked={tempColorType === 'beach'}
                  onChange={() => setTempColorType('beach')}
                  className="mt-1 mr-3"
                />
                <div>
                  <span className="block font-medium text-gray-800 dark:text-white">Soft Summer Beach Ball</span>
                  <span className="text-xs text-gray-500 dark:text-gray-400">A relaxed, pastel summer vibe.</span>
                  <div className="flex mt-2 space-x-1">
                    {beachColors.map(c => (
                      <div key={c} className="w-4 h-4 rounded-full" style={{ backgroundColor: c }}></div>
                    ))}
                  </div>
                </div>
              </label>

              {/* Option: Custom */}
              <label className={`flex items-start p-3 rounded-lg border cursor-pointer transition ${tempColorType === 'custom' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : 'border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50'}`}>
                <input
                  type="radio"
                  name="colorType"
                  checked={tempColorType === 'custom'}
                  onChange={() => setTempColorType('custom')}
                  className="mt-1 mr-3"
                />
                <div className="flex-grow">
                  <span className="block font-medium text-gray-800 dark:text-white">Custom Hex List</span>
                  <span className="text-xs text-gray-500 dark:text-gray-400">Enter hex codes (e.g. #F00, #00F)</span>

                  {tempColorType === 'custom' && (
                    <>
                      <div className="flex mt-2 space-x-1 min-h-[1rem] flex-wrap gap-y-1">
                        {customColorPreview.map((c, i) => (
                          <div key={i} className="w-4 h-4 rounded-full border border-gray-200 dark:border-gray-600 shadow-sm" style={{ backgroundColor: c }}></div>
                        ))}
                      </div>
                      <textarea
                        value={tempCustomColors}
                        onChange={(e) => setTempCustomColors(e.target.value)}
                        placeholder="#FF0000, #00FF00, #0000FF"
                        rows={3}
                        className={`w-full mt-2 p-2 text-sm border rounded focus:ring-2 font-mono transition-colors ${isCustomColorInvalid ? 'border-red-500 focus:ring-red-500 focus:border-red-500' : 'border-gray-300 dark:border-gray-600 focus:ring-indigo-500'} dark:bg-gray-700 dark:text-white`}
                        onClick={(e) => e.stopPropagation()}
                      />
                      {isCustomColorInvalid && <p className="text-xs text-red-500 mt-1">Please enter valid hex codes (e.g. #FF5733).</p>}
                    </>
                  )}
                </div>
              </label>
            </div>
          </Modal>

          {/* AI Generator Modal */}
          <Modal
            isOpen={showGenModal}
            onClose={() => setShowGenModal(false)}
            title="AI List Generator"
            icon={<SparklesIcon size={20} />}
            footer={
              <div className="flex justify-end space-x-2">
                <button onClick={() => setShowGenModal(false)} className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                <button
                  onClick={generateList}
                  disabled={isGenerating || !genPrompt.trim()}
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg flex items-center disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {isGenerating ? (
                    <>
                      <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                      Generating...
                    </>
                  ) : (
                    <>Generate <SparklesIcon size={16} className="ml-2" /></>
                  )}
                </button>
              </div>
            }
          >
            <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
              Describe what you want (e.g., "Lunch ideas for Indonesians who wants to lose weight but have given up on diet and exercise", "Excuses for being late", "Very spicy truth or dare questions").
            </p>
            <textarea
              value={genPrompt}
              onChange={(e) => setGenPrompt(e.target.value)}
              placeholder="Enter a topic..."
              rows={2}
              className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white resize-none"
              onKeyDown={(e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                  e.preventDefault();
                  generateList();
                }
              }}
              autoFocus
            />
          </Modal>

          {/* Help Modal */}
          <Modal
            isOpen={showHelpModal}
            onClose={() => setShowHelpModal(false)}
            title="Weighted Items Guide"
            icon={<HelpCircleIcon size={20} />}
            footer={
              <div className="flex justify-end">
                <button onClick={() => setShowHelpModal(false)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">Got it</button>
              </div>
            }
          >
            <div className="text-sm text-gray-600 dark:text-gray-300 space-y-3">
              <p>You can customize the probability of each item winning by assigning a <strong>weight</strong>.</p>
              <div className="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border border-gray-200 dark:border-gray-600 font-mono text-xs">
                <p><span className="text-indigo-600 dark:text-indigo-400">Pizza:10</span> <span className="text-gray-400">// Very likely (10x chance)</span></p>
                <p><span className="text-indigo-600 dark:text-indigo-400">Burger</span> <span className="text-gray-400">// Default weight is 1</span></p>
              </div>
              <ul className="list-disc list-inside space-y-1">
                <li>Format: <code>Item Name:Weight</code></li>
                <li>Higher number = Larger slice on the wheel.</li>
                <li>If no number is specified, it defaults to <strong>1</strong>.</li>
              </ul>
            </div>
          </Modal>

          {/* API Key Modal */}
          <Modal
            isOpen={showApiKeyModal}
            onClose={() => setShowApiKeyModal(false)}
            title="Gemini API Key"
            icon={<KeyIcon size={20} />}
            footer={
              <div className="flex justify-end space-x-2">
                <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                <button
                  onClick={saveApiKey}
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                >
                  Save Key
                </button>
              </div>
            }
          >
            <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
              To use AI features like the <strong>List Generator</strong> and <strong>Voice Announcer</strong>, you need a valid Google Gemini API key.
            </p>
            <div className="mb-4">
              <label className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">API Key</label>
              <input
                type="password"
                value={tempApiKey}
                onChange={(e) => setTempApiKey(e.target.value)}
                placeholder="Enter your API key here..."
                className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                autoFocus
              />
              <p className="text-xs text-gray-400 mt-1">
                Your key is stored locally in your browser and is never shared.
              </p>
            </div>
          </Modal>

          {/* OUT OF ORDER OVERLAY */}
          <OutOfOrderOverlay isVisible={isOutOfOrder} />

          {/* Toast Notification */}
          {
            toastQueue.length > 0 && (
              <Toast
                key={toastQueue[0].id}
                message={toastQueue[0].message}
                duration={toastQueue[0].duration}
                title={toastQueue[0].title}
                icon={toastQueue[0].icon}
                onClose={closeToast}
              />
            )
          }

        </div >
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>

</html>
