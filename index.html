<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpinWheel - Customizable Picker Wheel</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Custom Animations */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      body {
        overflow-x: hidden;
      }
      /* Scrollbar styling for the text area */
      textarea::-webkit-scrollbar {
        width: 8px;
      }
      textarea::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      textarea::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }
      textarea::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- Inline Icons ---
      const Icon = ({ children, size = 24, className = "" }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {children}
        </svg>
      );

      const SettingsIcon = (props) => (
        <Icon {...props}>
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          <circle cx="12" cy="12" r="3" />
        </Icon>
      );

      const Volume2Icon = (props) => (
        <Icon {...props}>
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
        </Icon>
      );

      const VolumeXIcon = (props) => (
        <Icon {...props}>
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="23" y1="9" x2="17" y2="15" />
          <line x1="17" y1="9" x2="23" y2="15" />
        </Icon>
      );

      const ShuffleIcon = (props) => (
        <Icon {...props}>
          <polyline points="16 3 21 3 21 8" />
          <line x1="4" y1="20" x2="21" y2="3" />
          <polyline points="21 16 21 21 16 21" />
          <line x1="15" y1="15" x2="21" y2="21" />
          <line x1="4" y1="4" x2="9" y2="9" />
        </Icon>
      );

      const Trash2Icon = (props) => (
        <Icon {...props}>
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          <line x1="10" y1="11" x2="10" y2="17" />
          <line x1="14" y1="11" x2="14" y2="17" />
        </Icon>
      );

      const TrophyIcon = (props) => (
        <Icon {...props}>
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
          <path d="M4 22h16" />
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
        </Icon>
      );

      // Confetti Logic
      const fireConfetti = () => {
        const colors = ["#ff0000", "#00ff00", "#0000ff", "#ffff00", "#ff00ff", "#00ffff"];
        const confettiCount = 150;
        const container = document.createElement("div");
        container.style.position = "fixed";
        container.style.top = "0";
        container.style.left = "0";
        container.style.width = "100%";
        container.style.height = "100%";
        container.style.pointerEvents = "none";
        container.style.zIndex = "9999";
        document.body.appendChild(container);

        for (let i = 0; i < confettiCount; i++) {
          const el = document.createElement("div");
          el.style.position = "absolute";
          el.style.width = "10px";
          el.style.height = "10px";
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          el.style.left = Math.random() * 100 + "vw";
          el.style.top = "-10px";
          el.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
          el.style.transform = `rotate(${Math.random() * 360}deg)`;

          const animationDuration = 1 + Math.random() * 2;
          el.style.transition = `top ${animationDuration}s ease-in, transform ${animationDuration}s linear`;
          container.appendChild(el);

          setTimeout(() => {
            el.style.top = "110vh";
            el.style.transform = `rotate(${Math.random() * 360 + 360}deg)`;
          }, 100);
        }

        setTimeout(() => {
          document.body.removeChild(container);
        }, 4000);
      };

      const App = () => {
        const [items, setItems] = useState([
          "Pizza",
          "Burger",
          "Sushi",
          "Tacos",
          "Salad",
          "Pasta",
          "Steak",
          "Ramen",
        ]);
        const [inputText, setInputText] = useState(items.join("\n"));
        const [isSpinning, setIsSpinning] = useState(false);
        const [winner, setWinner] = useState(null);
        const [soundEnabled, setSoundEnabled] = useState(true);

        // Refs for animation loop
        const canvasRef = useRef(null);
        const rotationRef = useRef(0);
        const isSpinningRef = useRef(false);
        const itemsRef = useRef(items);
        const velocityRef = useRef(0);

        // Sync items ref for the animation loop
        useEffect(() => {
          itemsRef.current = items;
        }, [items]);

        // Sync spinning ref
        useEffect(() => {
          isSpinningRef.current = isSpinning;
        }, [isSpinning]);

        const colors = [
          "#FF6B6B",
          "#4ECDC4",
          "#45B7D1",
          "#96CEB4",
          "#FFEEAD",
          "#FFD93D",
          "#FF9A8B",
          "#A0E7E5",
          "#B39CD0",
          "#FBE7C6",
          "#EB6B56",
          "#E056FD",
        ];

        // Update items from text area
        useEffect(() => {
          const list = inputText.split("\n").filter((item) => item.trim() !== "");
          setItems(list);
        }, [inputText]);

        // MAIN RENDER LOOP
        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animationFrameId;

          const render = () => {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 10;
            const currentItems = itemsRef.current;

            // --- Idle Spin Logic ---
            // Only increment small rotation if NOT in active spin mode
            if (!isSpinningRef.current && currentItems.length > 0 && velocityRef.current === 0) {
              rotationRef.current = (rotationRef.current + 0.002) % (2 * Math.PI);
            }

            // --- Drawing ---
            ctx.clearRect(0, 0, width, height);

            if (currentItems.length === 0) {
              // Empty State
              ctx.beginPath();
              ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
              ctx.fillStyle = "#f0f0f0";
              ctx.fill();
              ctx.strokeStyle = "#ddd";
              ctx.lineWidth = 2;
              ctx.stroke();

              ctx.fillStyle = "#888";
              ctx.font = "20px sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("Add items to spin!", centerX, centerY);
            } else {
              // Draw Wheel
              const sliceAngle = (2 * Math.PI) / currentItems.length;

              currentItems.forEach((item, index) => {
                const startAngle = index * sliceAngle + rotationRef.current;
                const endAngle = (index + 1) * sliceAngle + rotationRef.current;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = currentItems.length > 12 ? "bold 14px Arial" : "bold 18px Arial";
                ctx.fillText(
                  item.substring(0, 18) + (item.length > 18 ? "..." : ""),
                  radius - 20,
                  5
                );
                ctx.restore();
              });

              // Hub
              ctx.beginPath();
              ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
              ctx.fillStyle = "white";
              ctx.fill();
              ctx.strokeStyle = "#333";
              ctx.lineWidth = 4;
              ctx.stroke();

              // Border
              ctx.beginPath();
              ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
              ctx.strokeStyle = "#333";
              ctx.lineWidth = 5;
              ctx.stroke();
            }

            animationFrameId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animationFrameId);
        }, []); // Runs once on mount, subsequent updates handled by refs

        const spinWheel = () => {
          if (isSpinning || items.length === 0) return;

          setIsSpinning(true);
          setWinner(null);

          // Physics variables
          velocityRef.current = Math.random() * 0.2 + 0.5; // Initial speed: 0.5 - 0.7 radians/frame
          const friction = 0.985; // Friction coefficient to slow down the wheel
          let lastTime = performance.now();

          const animateSpin = (currentTime) => {
            // Apply friction to reduce velocity
            velocityRef.current *= friction;

            // "Grinding" effect at low speeds
            // As velocity gets low, add a small, opposing force that oscillates
            if (velocityRef.current < 0.05 && velocityRef.current > 0.001) {
              // The wobble intensity depends on current velocity
              const wobble = Math.sin(currentTime / 50) * (velocityRef.current * 0.5);
              rotationRef.current += wobble;
            }

            // Update rotation based on current velocity
            rotationRef.current += velocityRef.current;

            // Continue animation if velocity is still significant
            if (velocityRef.current > 0.0005) {
              requestAnimationFrame(animateSpin);
            } else {
              // Animation complete, wheel has stopped
              velocityRef.current = 0;
              setIsSpinning(false);
              calculateWinner(rotationRef.current);
            }
          };

          requestAnimationFrame(animateSpin);
        };

        const calculateWinner = (finalRotation) => {
          const normalizedRotation = finalRotation % (2 * Math.PI);
          const sliceAngle = (2 * Math.PI) / items.length;

          // Effective angle calculation
          let effectiveAngle = (2 * Math.PI - normalizedRotation) % (2 * Math.PI);
          if (effectiveAngle < 0) effectiveAngle += 2 * Math.PI;

          const winningIndex = Math.floor(effectiveAngle / sliceAngle);
          const winItem = items[winningIndex];

          setWinner(winItem);
          if (soundEnabled) {
            // Sound effect logic would go here
          }
          fireConfetti();
        };

        const handleShuffle = () => {
          const shuffled = [...items].sort(() => Math.random() - 0.5);
          setInputText(shuffled.join("\n"));
        };

        const handleClear = () => {
          if (confirm("Are you sure you want to clear the list?")) {
            setInputText("");
          }
        };

        return (
          <div className="min-h-screen bg-gray-100 flex flex-col font-sans text-gray-800">
            {/* Header */}
            <header className="bg-white shadow-sm p-4 flex justify-between items-center z-10">
              <div className="flex items-center space-x-2">
                <div className="bg-indigo-600 text-white p-2 rounded-lg">
                  <SettingsIcon size={24} />
                </div>
                <h1 className="text-xl md:text-2xl font-bold text-indigo-900">SpinWheel</h1>
              </div>
              <button
                onClick={() => setSoundEnabled(!soundEnabled)}
                className="p-2 rounded-full hover:bg-gray-100 transition"
                title={soundEnabled ? "Mute Sound" : "Enable Sound"}
              >
                {soundEnabled ? <Volume2Icon size={24} /> : <VolumeXIcon size={24} />}
              </button>
            </header>

            <main className="flex-grow flex flex-col md:flex-row overflow-hidden">
              {/* Left Panel: The Wheel */}
              <div className="flex-1 flex flex-col items-center justify-center p-4 relative min-h-[50vh]">
                {/* Pointer Triangle */}
                <div className="absolute z-20 right-0 md:right-auto top-1/2 -translate-y-1/2 translate-x-1/2 md:translate-x-[210px] lg:translate-x-[260px] filter drop-shadow-lg pointer-events-none">
                  <div className="w-0 h-0 border-t-[20px] border-t-transparent border-r-[40px] border-r-red-600 border-b-[20px] border-b-transparent transform rotate-180 md:rotate-0"></div>
                </div>

                <div className="relative">
                  <canvas
                    ref={canvasRef}
                    width={500}
                    height={500}
                    className="max-w-full h-auto max-h-[60vh] md:max-h-[80vh] w-full object-contain filter drop-shadow-xl"
                  />

                  {/* Center Spin Button Overlay */}
                  <button
                    onClick={spinWheel}
                    disabled={isSpinning || items.length === 0}
                    className={`absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2
                                            w-20 h-20 rounded-full bg-white border-4 border-indigo-600 shadow-lg
                                            flex items-center justify-center text-indigo-700 font-black text-xl tracking-wider
                                            hover:scale-105 active:scale-95 transition-all z-30
                                            ${
                                              isSpinning
                                                ? "opacity-50 cursor-not-allowed"
                                                : "animate-pulse"
                                            }`}
                  >
                    SPIN
                  </button>
                </div>
              </div>

              {/* Right Panel: Controls */}
              <div className="w-full md:w-96 bg-white border-l border-gray-200 flex flex-col h-[50vh] md:h-auto z-10 shadow-xl md:shadow-none">
                <div className="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                  <h2 className="font-bold text-gray-700 flex items-center">
                    <SettingsIcon className="w-4 h-4 mr-2" /> Inputs
                  </h2>
                  <span className="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded-full font-medium">
                    {items.length} Items
                  </span>
                </div>

                <div className="flex-grow p-4 overflow-hidden flex flex-col">
                  <label className="text-sm text-gray-500 mb-2 block">
                    Enter text (one item per line):
                  </label>
                  <textarea
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    className="flex-grow w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none font-mono text-sm shadow-inner bg-gray-50"
                    placeholder="Enter items here..."
                  />
                </div>

                <div className="p-4 border-t border-gray-200 grid grid-cols-2 gap-3 bg-gray-50">
                  <button
                    onClick={handleShuffle}
                    className="flex items-center justify-center px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-gray-700 font-medium transition shadow-sm"
                  >
                    <ShuffleIcon className="w-4 h-4 mr-2" /> Shuffle
                  </button>
                  <button
                    onClick={handleClear}
                    className="flex items-center justify-center px-4 py-2 bg-white border border-red-200 text-red-600 rounded-lg hover:bg-red-50 font-medium transition shadow-sm"
                  >
                    <Trash2Icon className="w-4 h-4 mr-2" /> Clear
                  </button>
                </div>
              </div>
            </main>

            {/* Winner Modal */}
            {winner && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-in fade-in duration-300">
                <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center transform scale-100 animate-in zoom-in-95 duration-300 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

                  <div className="mx-auto w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mb-4 text-yellow-600">
                    <TrophyIcon size={32} />
                  </div>

                  <h3 className="text-gray-500 uppercase tracking-widest text-sm font-bold mb-2">
                    We have a winner!
                  </h3>
                  <div className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-8 break-words">
                    {winner}
                  </div>

                  <div className="grid grid-cols-1 gap-3">
                    <button
                      onClick={() => setWinner(null)}
                      className="w-full py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-gray-800 transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                    >
                      Close
                    </button>
                    <button
                      onClick={() => {
                        // Remove winner logic
                        const newItems = items.filter((i) => i !== winner);
                        setInputText(newItems.join("\n"));
                        setWinner(null);
                      }}
                      className="w-full py-3 bg-white border-2 border-gray-200 text-gray-600 rounded-xl font-bold hover:border-red-200 hover:text-red-500 hover:bg-red-50 transition"
                    >
                      Remove & Spin Again
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
