<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpinWheel - Customizable Picker Wheel</title>

  <!-- PWA Manifest & Meta Tags -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpinWheel">

  <!-- Dynamic Favicon/Icon Generation -->
  <script>
    (function() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><circle cx="256" cy="256" r="256" fill="#4f46e5"/><path d="M256 256 256 0 A256 256 0 0 1 477.7 128 Z" fill="#fbbf24"/><path d="M256 256 477.7 128 A256 256 0 0 1 477.7 384 Z" fill="#ec4899"/><path d="M256 256 477.7 384 A256 256 0 0 1 256 512 Z" fill="#10b981"/><path d="M256 256 256 512 A256 256 0 0 1 34.3 384 Z" fill="#3b82f6"/><path d="M256 256 34.3 384 A256 256 0 0 1 34.3 128 Z" fill="#8b5cf6"/><path d="M256 256 34.3 128 A256 256 0 0 1 256 0 Z" fill="#ef4444"/><circle cx="256" cy="256" r="40" fill="#fff"/></svg>`;
      const iconUrl = "data:image/svg+xml;base64," + btoa(iconSvg);

      // Set Favicon
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = iconUrl;

      // Set Apple Touch Icon
      let appleLink = document.querySelector("link[rel='apple-touch-icon']");
      if (!appleLink) {
        appleLink = document.createElement('link');
        appleLink.rel = 'apple-touch-icon';
        document.head.appendChild(appleLink);
      }
      appleLink.href = iconUrl;

      // Generate Manifest
      const manifest = {
        "name": "SpinWheel",
        "short_name": "SpinWheel",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#ffffff",
        "theme_color": "#4f46e5",
        "icons": [
          {
            "src": iconUrl,
            "sizes": "512x512",
            "type": "image/svg+xml",
            "purpose": "any maskable"
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
      const manifestUrl = URL.createObjectURL(manifestBlob);

      let manifestLink = document.querySelector("link[rel='manifest']");
      if (!manifestLink) {
        manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        document.head.appendChild(manifestLink);
      }
      manifestLink.href = manifestUrl;
    })();
  </script>

  <!-- Tailwind CSS with Dark Mode Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

  <style>
    body {
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
      overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
    }
    /* Scrollbar styling for the text area */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: transparent;
    }
    textarea::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark textarea::-webkit-scrollbar-thumb {
      background: #475569;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .dark textarea::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Smoke Animation */
    @keyframes smokeRise {
      0% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-100px) scale(3) rotate(var(--rot));
        opacity: 0;
      }
    }

    /* Loading Screen Animations */
    @keyframes beachBounce {
        0%, 100% {
            transform: translateY(0) rotate(0deg);
            animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
            transform: translateY(-40px) rotate(180deg);
            animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
    }

    @keyframes shadowScale {
        0%, 100% { transform: scaleX(1); opacity: 0.4; }
        50% { transform: scaleX(0.6); opacity: 0.1; }
    }

    /* Out of Order Neon Flicker */
    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
        text-shadow: 0 0 10px #ff0000, 0 0 100px #ff0000;
      }
      20%, 24%, 55% {
        opacity: 0.1;
        text-shadow: none;
      }
    }

    /* Spark Animation */
    @keyframes sparkFlash {
      0% { opacity: 1; transform: scale(1) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.5) rotate(45deg); }
      100% { opacity: 0; transform: scale(0); }
    }

    @keyframes shake {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(-1px, 1px) rotate(-1deg); }
        50% { transform: translate(1px, -1px) rotate(1deg); }
        75% { transform: translate(-2px, 1px) rotate(0deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>
</head>

    // Confetti Logic - Fireworks Style Physics
    const fireConfetti = () => {
      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
      const confettiCount = 250; // Increased count slightly for explosion effect
      const container = document.createElement('div');
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.width = '100%';
      container.style.height = '100%';
      container.style.pointerEvents = 'none';
      container.style.zIndex = '9999';
      container.style.perspective = '1000px'; // Depth for 3D
      document.body.appendChild(container);

      const particles = [];
      const startX = window.innerWidth / 2;
      // Start slightly below center to align better with the modal center
      const startY = window.innerHeight / 2 + 50;

      for (let i = 0; i < confettiCount; i++) {
        const el = document.createElement('div');
        el.style.position = 'absolute';
        el.style.left = '0'; // Positioning handled by translate3d
        el.style.top = '0';

        // Random size and shape
        const size = Math.random() * 8 + 6 + 'px';
        el.style.width = size;
        el.style.height = Math.random() > 0.5 ? size : (Math.random() * 4 + 4 + 'px'); // Square or rectangle

        const colorHex = colors[Math.floor(Math.random() * colors.length)];
        el.style.backgroundColor = colorHex;
        const startOpacity = 0.7 + Math.random() * 0.2; // Semi-transparent (70-90%)
        el.style.opacity = startOpacity.toString();
        el.style.willChange = 'transform, opacity'; // Optimization

        container.appendChild(el);

        // Physics Initialization
        // Explosion mechanics: random angle, random upward force
        const angle = Math.random() * Math.PI * 2; // Random direction around center
        const explosionForce = Math.random() * 15 + 10; // Random power

        // Initial velocities based on angle and force
        // Ensure a strong upward bias (negative Y) for the "pop"
        let vx = Math.cos(angle) * explosionForce * (Math.random() * 0.8 + 0.2);
        let vy = -Math.abs(Math.sin(angle) * explosionForce) - (Math.random() * 15 + 10);

        particles.push({
          el,
          x: startX,
          y: startY,
          vx: vx,
          vy: vy,
          gravity: 0.07 + Math.random() * 0.05, // Reduced gravity (was ~0.5) for floaty fall
          drag: 0.96, // Increased drag (was 0.98) for air resistance
          rotX: Math.random() * 360,
          rotY: Math.random() * 360,
          rotZ: Math.random() * 360,
          rotSpeedX: (Math.random() - 0.5) * 15, // Tumble speed
          rotSpeedY: (Math.random() - 0.5) * 15,
          rotSpeedZ: (Math.random() - 0.5) * 10,
          opacity: startOpacity,
          fadeStart: Date.now() + 3000 + Math.random() * 2000 // Start fading later (after 3-5s)
        });
      }

      let animationFrameId;
      const startTime = Date.now();

      // Physics Animation Loop
      const animate = () => {
        const now = Date.now();
        let activeParticles = 0;

        particles.forEach(p => {
          // Apply physics
          p.vy += p.gravity; // Apply gravity
          p.vx *= p.drag;    // Apply air resistance
          p.vy *= p.drag;

          p.x += p.vx;
          p.y += p.vy;

          // Apply rotation
          p.rotX += p.rotSpeedX;
          p.rotY += p.rotSpeedY;
          p.rotZ += p.rotSpeedZ;

          // Update DOM styling using translate3d for performance
          // We subtract half width/height to center the rotation point
          p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotateX(${p.rotX}deg) rotateY(${p.rotY}deg) rotateZ(${p.rotZ}deg)`;

          // Fade out logic
          if (now > p.fadeStart) {
              p.opacity -= 0.015;
              p.el.style.opacity = Math.max(0, p.opacity);
          }

          // Check if particle is still visible on screen
          if (p.y < window.innerHeight + 50 && p.opacity > 0) {
              activeParticles++;
          }
        });

        // Continue animation if particles are active and under time limit (increased to 20s)
        if (activeParticles > 0 && (now - startTime < 20000)) {
           animationFrameId = requestAnimationFrame(animate);
        } else {
           // Cleanup
           if (document.body.contains(container)) {
             document.body.removeChild(container);
           }
        }
      };

      animate();
    };

    // Helper function to load state from localStorage
    const loadState = (key, defaultValue) => {

    // Helper for relative time
    const getRelativeTime = (date) => {
      if (!date) return '';
      const now = new Date();
      const diffInSeconds = Math.floor((now - new Date(date)) / 1000);
      const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });

      if (diffInSeconds < 60) return 'just now'; // cosmetic preference for very recent events
      // OR use: return rtf.format(-diffInSeconds, 'second');

      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return rtf.format(-diffInMinutes, 'minute');

      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return rtf.format(-diffInHours, 'hour');

      const diffInDays = Math.floor(diffInHours / 24);
      if (diffInDays < 7) return rtf.format(-diffInDays, 'day');

      const diffInWeeks = Math.floor(diffInDays / 7);
      if (diffInWeeks < 4) return rtf.format(-diffInWeeks, 'week');

      const diffInMonths = Math.floor(diffInDays / 30);
      if (diffInMonths < 12) return rtf.format(-diffInMonths, 'month');

      const diffInYears = Math.floor(diffInDays / 365);
      return rtf.format(-diffInYears, 'year');
    };

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

                    generationConfig: {

                    }
                })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            const audioContent = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (audioContent) {
                const audioBytes = Uint8Array.from(atob(audioContent), c => c.charCodeAt(0));
                // Basic WAV header construction for PCM data
                const wavHeader = new ArrayBuffer(44);
                const view = new DataView(wavHeader);
                const sampleRate = 24000;
                const numChannels = 1;
                const bitsPerSample = 16;

                const writeString = (offset, string) => {
                    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
                };

                writeString(0, 'RIFF');
                view.setUint32(4, 36 + audioBytes.length, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * 2, true);
                view.setUint16(32, numChannels * 2, true);
                view.setUint16(34, bitsPerSample, true);
                writeString(36, 'data');
                view.setUint32(40, audioBytes.length, true);

                const blob = new Blob([wavHeader, audioBytes], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);

                setTimeout(() => audio.play(), 500);
            }
        } catch (error) {
            console.error("TTS failed", error);
        }

        if (!soundEnabled || !audioCtxRef.current || isOutOfOrder) return;
        const ctx = audioCtxRef.current;

        // Stop existing if any
        if (chargeOscillatorRef.current) {
            try { chargeOscillatorRef.current.stop(); } catch(e){}

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // Sawtooth gives a buzzy, mechanical "motor" sound
        osc.type = 'sawtooth';
        // Start pitch
        osc.frequency.setValueAtTime(150, ctx.currentTime);

        // Fade in to avoid clicking
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(ctx.destination);

        chargeGainRef.current = gain;

         if (!chargeOscillatorRef.current || !audioCtxRef.current) return;
         const ctx = audioCtxRef.current;

         // Ramp pitch from 150Hz to 600Hz based on power
         // Using setTargetAtTime for smooth transitions
         const targetFreq = 150 + (power * 450);
         chargeOscillatorRef.current.frequency.setTargetAtTime(targetFreq, ctx.currentTime, 0.1);

         // Slightly increase volume as power builds
         if (chargeGainRef.current) {
            chargeGainRef.current.gain.setTargetAtTime(0.1 + (power * 0.05), ctx.currentTime, 0.1);
         }
      };

      const stopChargeSound = () => {
        if (chargeOscillatorRef.current && audioCtxRef.current) {
            try {
                const ctx = audioCtxRef.current;
                const gain = chargeGainRef.current;
                const osc = chargeOscillatorRef.current;

                // Fade out quickly
                if (gain) {
                    gain.gain.cancelScheduledValues(ctx.currentTime);
                    gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                }

                setTimeout(() => {
                    if (osc) {
                        osc.stop();
                        osc.disconnect();
                    }
                    if (gain) gain.disconnect();
                }, 200);

            } catch (e) {}

            chargeOscillatorRef.current = null;
            chargeGainRef.current = null;
        }
      };

      const playTickSound = () => {
        if (!soundEnabled || !audioCtxRef.current) return;
        const ctx = audioCtxRef.current;

        // Short, "plastic click" sound
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      };

      const playWinSound = () => {
        if (!soundEnabled || !audioCtxRef.current) return;
        const ctx = audioCtxRef.current;
        const now = ctx.currentTime;

        // Helper for playing a tone
        const playTone = (freq, start, dur, type = 'triangle', vol = 0.1) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(vol, start + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + dur);
        };

        // A major fanfare sequence (C Major)
        playTone(523.25, now + 0.0, 0.3, 'square', 0.1); // C5
        playTone(659.25, now + 0.1, 0.3, 'square', 0.1); // E5
        playTone(783.99, now + 0.2, 0.3, 'square', 0.1); // G5

        // The "Ta-Da" finale (Chord)
        playTone(523.25, now + 0.3, 1.5, 'triangle', 0.15); // C5
        playTone(659.25, now + 0.3, 1.5, 'triangle', 0.15); // E5
        playTone(783.99, now + 0.3, 1.5, 'triangle', 0.15); // G5
        playTone(1046.50, now + 0.3, 2.0, 'sawtooth', 0.1); // C6 (Top Note, sharper)
      };

      const playFireCrackle = () => {
        if (!soundEnabled || !audioCtxRef.current || isOutOfOrder) return;
        const ctx = audioCtxRef.current;

        // Synthesize a short burst of noise (crackle)
        const bufferSize = ctx.sampleRate * 0.1; // 0.1 seconds of noise
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        // Filter to make it sound more like fire (low rumble + high crackle)
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000; // Muffle the harsh white noise

        const gain = ctx.createGain();
        // Random volume for texture
        gain.gain.setValueAtTime(0.05 + Math.random() * 0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
      };

      const playBreakdownSound = () => {
          if (!soundEnabled || !audioCtxRef.current) return;
          const ctx = audioCtxRef.current;

          // A loud "clunk" and power down sound
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 1);

          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + 1);
      };

      // MAIN RENDER LOOP
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const NUM_PINS = 30; // Fixed number of pins for the game show feel

        const render = () => {
          const width = canvas.width;
          const height = canvas.height;
          const centerX = width / 2;
          const centerY = height / 2;
          const radius = Math.min(width, height) / 2 - 20; // Leave room for pins
          const currentItems = itemsRef.current;
          const currentColors = colorsRef.current; // Use ref for current colors
          const isDark = isDarkModeRef.current;
          const shouldHide = hideLabelsRef.current;

          // --- Idle Spin Logic ---
          // CHANGED: Added !isChargingRef.current to stop idle spin while charging
          if (!isSpinningRef.current && !isChargingRef.current && currentItems.length > 0 && velocityRef.current === 0 && !winnerRef.current) {
            rotationRef.current = (rotationRef.current + 0.002) % (2 * Math.PI);
            lastTickRef.current = rotationRef.current;
          }

          // --- Drawing ---
          ctx.clearRect(0, 0, width, height);

          if (currentItems.length === 0) {
            // Empty State
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#334155' : '#f0f0f0';
            ctx.fill();
            ctx.strokeStyle = isDark ? '#475569' : '#ddd';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = isDark ? '#94a3b8' : '#888';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Add items to spin!', centerX, centerY);
          } else {
            // Calculate Total Weight
            const totalWeight = currentItems.reduce((sum, item) => sum + item.weight, 0);

            // Draw Wheel Slices
            let currentAngle = rotationRef.current;

            currentItems.forEach((item, index) => {
              // Calculate slice size based on weight
              const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);

              const startAngle = currentAngle;
              const endAngle = currentAngle + sliceAngle;

              ctx.beginPath();
              ctx.moveTo(centerX, centerY);
              ctx.arc(centerX, centerY, radius, startAngle, endAngle);
              ctx.closePath();

              ctx.fillStyle = currentColors[index % currentColors.length]; // Dynamic colors
              ctx.fill();
              ctx.stroke();

              // Draw text
              ctx.save();
              ctx.translate(centerX, centerY);
              // Rotate to center of the weighted slice
              ctx.rotate(startAngle + sliceAngle / 2);
              ctx.textAlign = "right";
              ctx.fillStyle = "#fff";
              ctx.font = currentItems.length > 12 ? "bold 14px Arial" : "bold 18px Arial";

              const displayText = shouldHide ? "?" : (item.text.substring(0, 18) + (item.text.length > 18 ? '...' : ''));

              ctx.fillText(displayText, radius - 20, 5);
              ctx.restore();

              // Advance angle for next item
              currentAngle += sliceAngle;
            });

            // Hub
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#1e293b' : 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Border
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Draw Pins
            const pinRadius = radius + 10; // Pins sit outside the main wheel
            for (let i = 0; i < NUM_PINS; i++) {
                const angle = (i * 2 * Math.PI / NUM_PINS) + rotationRef.current;
                const px = centerX + Math.cos(angle) * pinRadius;
                const py = centerY + Math.sin(angle) * pinRadius;

                ctx.beginPath();
                ctx.arc(px, py, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#C0C0C0'; // Silver pins
                ctx.fill();
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
          }

          // --- Pointer Animation Logic ---
          if (pointerRef.current) {
             const pinSpacing = (2 * Math.PI) / NUM_PINS;
             const pinPhase = (rotationRef.current % pinSpacing) / pinSpacing;

             let pointerAngle = 0;

             // Physics Parameters
             const maxAngle = 40;
             const pushThreshold = 0.75; // When the pin starts pushing the pointer (0.0 to 1.0)

             if (pinPhase > pushThreshold) {
                 // PUSH PHASE: Pin contacts pointer and pushes it down (Clockwise)
                 // Map range [0.85, 1.0] to [0, maxAngle]
                 // Inverted direction per user fix
                 const t = (pinPhase - pushThreshold) / (pushThreshold - 1);
                 // Use a slight curve for weight
                 pointerAngle = t * maxAngle;
             } else {
                 // SPRING/SNAP PHASE: Pin releases, pointer snaps back
                 // Damped harmonic oscillator: A * e^(-ct) * cos(wt)
                 // t goes from 0.0 to 0.85
                 const t = pinPhase;

                 // Tune these for "snapiness"
                 const decay = 10; // How fast energy is lost
                 const freq = 100;  // Wiggle speed

                 // Start at maxAngle (t=0), decay to 0
                 pointerAngle = maxAngle * Math.exp(-decay * t) * Math.cos(freq * t);
             }

             pointerRef.current.style.transform = `rotate(${pointerAngle}deg)`;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      // Smoke Effect Logic
      const spawnSmoke = () => {
        if (!smokeContainerRef.current) return;

        const timeOver = overchargeRef.current;
        const delay = 3000; // 3 seconds delay before smoke starts

        // If we haven't passed the delay threshold, don't spawn anything
        if (timeOver < delay) return;

        // Calculate effective time for phases relative to the start of smoke
        const effectiveTime = timeOver - delay;

        // Determine intensity phases
        // Phase 1 (0-5s of smoke): White -> Grey
        // Phase 2 (5-10s of smoke): Grey -> Dark Grey
        // Phase 3 (10s+ of smoke): Inferno (Black + Fire)

        const intensity = Math.min(effectiveTime / 5000, 1);
        const extremeIntensity = Math.max(0, Math.min((effectiveTime - 5000) / 5000, 1));
        const isInferno = effectiveTime > 10000;

        // Probability to spawn a particle this frame
        if (Math.random() > 0.1 + intensity * 0.5) return;

        const el = document.createElement('div');
        let size = 10 + Math.random() * 20 + intensity * 30;

        // Phase 3: Double size for the smoke
        if (isInferno) size *= 2;

        // Calculate Smoke Color
        let color;
        if (isInferno) {
            // Pitch black / very dark grey for inferno
            const val = Math.floor(Math.random() * 30);
            color = `rgb(${val},${val},${val})`;
        } else {
            // Progressive darkening from White (255) to Grey
            const greyVal = Math.floor(255 - intensity * 100 - extremeIntensity * 100);
            color = `rgb(${greyVal},${greyVal},${greyVal})`;
        }

        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.background = color;
        el.style.position = 'absolute';
        el.style.borderRadius = '50%';
        el.style.filter = 'blur(8px)';
        el.style.pointerEvents = 'none';

        // Random position around center
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 40;
        const left = 50 + Math.cos(angle) * dist;
        const top = 50 + Math.sin(angle) * dist;

        el.style.left = `calc(${left}% - ${size/2}px)`;
        el.style.top = `calc(${top}% - ${size/2}px)`;

        // Random rotation
        el.style.setProperty('--rot', `${(Math.random() - 0.5) * 360}deg`);

        el.style.animation = `smokeRise ${1 + Math.random()}s forwards`;

        smokeContainerRef.current.appendChild(el);

        // --- FIRE PARTICLES (Inferno Phase Only) ---
        if (isInferno) {
             // Play crackle sound randomly (approx 20% of frames) to create a texture
             // 60fps * 0.2 = ~12 crackles per second
             if (Math.random() > 0.8) playFireCrackle();

             if (Math.random() > 0.5) {
                 const fire = document.createElement('div');
                 // Increased fire particle size for better visibility
                 const fSize = 50 + Math.random() * 25;
                 const fColors = ['#ef4444', '#f97316', '#eab308']; // Red, Orange, Yellow
                 const fColor = fColors[Math.floor(Math.random() * fColors.length)];

                 fire.style.width = `${fSize}px`;
                 fire.style.height = `${fSize}px`;
                 fire.style.background = fColor;
                 fire.style.position = 'absolute';
                 fire.style.borderRadius = '50%';
                 fire.style.filter = 'blur(4px)';
                 fire.style.pointerEvents = 'none';

                 // Fire spawns tighter to the center
                 const fLeft = 50 + (Math.random() - 0.5) * 30;
                 const fTop = 50 + (Math.random() - 0.5) * 30;

                 fire.style.left = `calc(${fLeft}% - ${fSize/2}px)`;
                 fire.style.top = `calc(${fTop}% - ${fSize/2}px)`;

                 // Fire rises faster and dies quicker than smoke
                 fire.style.animation = `smokeRise 0.6s forwards`;

                 smokeContainerRef.current.appendChild(fire);

                 // Cleanup fire
                 setTimeout(() => {
                    if (fire.parentNode) fire.parentNode.removeChild(fire);
                 }, 600);
             }
        }

        // Cleanup Smoke
        setTimeout(() => {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 2000);
      };


      // Power Meter Logic
      const handlePointerDown = (e) => {
        // Prevent default to stop text selection or scrolling
        if (e.cancelable) e.preventDefault();

        // If out of order, do nothing
        if (isOutOfOrder) return;

        // If currently spinning, stop it. Do NOT start a new charge/spin cycle.
        if (isSpinningRef.current) {
            handleStopSpin();
            return;
        }

        if (items.length === 0) return;

        // Initialize audio context immediately on user interaction
        initAudio();

        // Reset power refs
        chargePowerRef.current = 0;
        setChargePower(0);
        isChargingRef.current = false;
        overchargeRef.current = 0; // Reset overcharge

        // Clear any existing hold timer
        if (pressTimerRef.current) clearTimeout(pressTimerRef.current);

        // Start delay timer. If user releases before this fires, it's a TAP.
        pressTimerRef.current = setTimeout(() => {
            // User held long enough: Start Charging
            isChargingRef.current = true;
            setIsCharging(true);

            // Start Audio
            startChargeSound();

            // Clear this timer ref so MouseUp knows we entered charging mode
            pressTimerRef.current = null;

            const startTime = Date.now();

            if (chargeIntervalRef.current) clearInterval(chargeIntervalRef.current);

            chargeIntervalRef.current = setInterval(() => {
                const elapsed = Date.now() - startTime;
                // Fill up in 1.5 seconds
                let power = Math.min(elapsed / 1500, 1);

                // If fully charged, start counting overcharge time
                if (power >= 1) {
                    overchargeRef.current += 16; // Add ~16ms per frame
                    spawnSmoke();

                    // BREAKDOWN LOGIC: Overcharge > 15s (10s past Inferno start which is 5s)
                    // Actually phase logic:
                    // 0-3s (Safe)
                    // 3-8s (Steam)
                    // 8-13s (Smoke)
                    // 13s+ (Inferno)
                    // Let's break it 5 seconds AFTER Inferno starts (13s + 5s = 18s total overcharge time)
                    if (overchargeRef.current > 18000) {
                        clearInterval(chargeIntervalRef.current);
                        chargeIntervalRef.current = null;

                        stopChargeSound();
                        playBreakdownSound();

                        setIsCharging(false);
                        setChargePower(0);
                        isChargingRef.current = false;

                        setIsOutOfOrder(true); // TRIGGER BROKEN STATE
                        return;
                    }
                }

                // Update sound pitch based on power
                updateChargeSound(power);

                // Update both state (for visual) and ref (for logic)
                setChargePower(power);
                chargePowerRef.current = power;
            }, 16);
        }, 200); // 200ms threshold for hold
      };

      const handlePointerUpOrLeave = (e) => {
         if (isOutOfOrder) return; // Dead interaction

         if (e && e.cancelable) e.preventDefault();

         // Case 1: User released QUICKLY (Tap)
         // pressTimerRef is still active, meaning the Hold threshold wasn't reached.
         if (pressTimerRef.current !== null) {
             clearTimeout(pressTimerRef.current);
             pressTimerRef.current = null;

             // Trigger Full Power Spin
             spinWheel(1.0);
             return;
         }

         // Case 2: User released after HOLDING (Power Meter was active)
         if (isChargingRef.current) {
             stopCharging();
             return;
         }
      };

      const stopCharging = () => {
        if (isOutOfOrder) return;

        // Check synchronous ref to handle fast clicks
        if (!isChargingRef.current) return;

        // Stop Audio
        stopChargeSound();

        isChargingRef.current = false;
        setIsCharging(false);

        if (chargeIntervalRef.current) {
            clearInterval(chargeIntervalRef.current);
            chargeIntervalRef.current = null;
        }

        // Use REF value to guarantee freshness regardless of render cycle
        // Reduced minimum power for a very gentle nudge
        const finalPower = Math.max(chargePowerRef.current, 0.02);
        spinWheel(finalPower);

        setChargePower(0);
        chargePowerRef.current = 0;
        overchargeRef.current = 0; // Reset smoke timer logic immediately
      };

      const cancelCharging = () => {
          if (isChargingRef.current) {
             stopCharging();
          }
      };

      const spinWheel = (powerFactor = 1.0) => {
        // CHANGED: Check Ref here too for safety
        if (isSpinningRef.current || items.length === 0) return;

        initAudio();

        // CHANGED: Update Ref synchronously BEFORE state
        isSpinningRef.current = true;
        setIsSpinning(true);

        setWinner(null);
        lastTickRef.current = rotationRef.current;

        const baseSpeed = Math.random() * 0.2 + 0.5;
        // CHANGED: Adjusted scaling to allow much slower speeds (5% to 100% instead of 20% to 100%)
        velocityRef.current = baseSpeed * (0.05 + 0.95 * powerFactor);

        const maxDuration = spinDuration;
        // CHANGED: Reduced minimum duration from 2000ms to 500ms for quick nudges
        const targetDuration = Math.max(500, maxDuration * powerFactor);
        const stopThreshold = 0.0001;
        const totalFrames = targetDuration / 16.667;
        const baseFriction = Math.pow(stopThreshold / velocityRef.current, 1 / totalFrames);

        let lastTime = performance.now();

        const animateSpin = (currentTime) => {
          const dt = currentTime - lastTime;
          lastTime = currentTime;
          const frameRatio = dt / 16.67;
          velocityRef.current *= Math.pow(baseFriction, frameRatio);

          if (velocityRef.current < 0.05 && velocityRef.current > 0.001) {
            const wobble = Math.sin(currentTime / 50) * (velocityRef.current * 0.15);
            rotationRef.current += wobble;
          }

          rotationRef.current += velocityRef.current * frameRatio;

          // --- TICK SOUND LOGIC ---
          const NUM_PINS = 30;
          const pinSpacing = (2 * Math.PI) / NUM_PINS;

          const currentStep = Math.floor(rotationRef.current / pinSpacing);
          const lastStep = Math.floor(lastTickRef.current / pinSpacing);

          if (currentStep !== lastStep) {
             playTickSound();
          }
          lastTickRef.current = rotationRef.current;

          if (velocityRef.current > stopThreshold) {
            spinFrameRef.current = requestAnimationFrame(animateSpin);
          } else {
            velocityRef.current = 0;

            // CHANGED: Update Ref synchronously
            isSpinningRef.current = false;
            setIsSpinning(false);

            calculateWinner(rotationRef.current);
          }
        };
        spinFrameRef.current = requestAnimationFrame(animateSpin);
      };

      const handleStopSpin = () => {
        if (spinFrameRef.current) {
            cancelAnimationFrame(spinFrameRef.current);
            spinFrameRef.current = null;
        }
        // CHANGED: Update Ref synchronously
        isSpinningRef.current = false;
        setIsSpinning(false);

        velocityRef.current = 0;
      };

      const calculateWinner = (finalRotation) => {
        const normalizedRotation = finalRotation % (2 * Math.PI);

        // Weighted Winner Calculation
        // 1. Calculate effective angle (Right side is 0, moves counter-clockwise relative to rotation)
        let effectiveAngle = (2 * Math.PI - normalizedRotation) % (2 * Math.PI);
        if (effectiveAngle < 0) effectiveAngle += 2 * Math.PI;

        // 2. Calculate total weight
        const currentItems = itemsRef.current;
        const totalWeight = currentItems.reduce((sum, item) => sum + item.weight, 0);

        // 3. Iterate to find which slice encompasses the effectiveAngle
        let accumulatedAngle = 0;
        let winItem = null;

        for (let i = 0; i < currentItems.length; i++) {
            const item = currentItems[i];
            const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);

            if (effectiveAngle >= accumulatedAngle && effectiveAngle < accumulatedAngle + sliceAngle) {
                winItem = item.text;
                break;
            }
            accumulatedAngle += sliceAngle;
        }

        // Fallback (should mostly not happen unless float precision error)
        if (!winItem && currentItems.length > 0) winItem = currentItems[currentItems.length - 1].text;

        setWinner(winItem);

        // Add to history
        setHistory(prev => {
            const newHistory = [{
                id: Date.now(),
                text: winItem,
                timestamp: new Date()
            }, ...prev];
            return newHistory;
        });

        if (soundEnabled) {
           playWinSound();
           if (aiVoiceEnabled && geminiApiKey) {
               announceWinner(winItem); // Call Gemini TTS only if enabled and key exists
           }
        }
        fireConfetti();
      };

      const handleShuffle = () => {
        const shuffled = [...items].sort(() => Math.random() - 0.5);
        setInputText(itemsToString(shuffled));
      };

      const handleClear = () => {
        if(confirm("Are you sure you want to clear the list?")) {
          setInputText("");
        }
      };

      return (
        // CHANGED: Added md:h-screen and md:overflow-hidden to lock desktop layout to viewport
        <div className="min-h-screen md:h-screen md:overflow-hidden bg-gray-100 dark:bg-gray-900 flex flex-col font-sans text-gray-800 dark:text-gray-100 transition-colors duration-300">

          {/* Header */}
          <header className="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center z-50 border-b dark:border-gray-700 transition-colors duration-300">
            <div className="flex items-center space-x-2">
              <div className="rounded-full overflow-hidden shadow-sm">
                <SpinWheelLogo size={40} />
              </div>
              <h1 className="text-xl md:text-2xl font-bold text-indigo-900 dark:text-indigo-400">SpinWheel</h1>
            </div>
            <div className="flex items-center space-x-2">

              {/* GitHub Link */}
              <a
                href="https://github.com/samuelkripto/spin-wheel"
                target="_blank"
                rel="noopener noreferrer"
                className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300"
                title="View on GitHub"
              >
                <GithubIcon size={24} />
              </a>

              {/* Theme Dropdown */}
              <div className="relative" ref={themeMenuRef}>
                <button
                  onClick={() => setShowThemeMenu(!showThemeMenu)}
                  className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400"
                  title="Theme Settings"
                >
                  {getThemeIcon()}
                </button>

                {showThemeMenu && (
                  <div className="absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 z-50 overflow-hidden animate-[fade-in_0.2s_ease-out]">
                    <div className="py-1">
                      <button
                        onClick={() => {setTheme('auto'); setShowThemeMenu(false)}}
                        className={`flex items-center w-full px-4 py-2 text-sm text-left ${theme === 'auto' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                      >
                        <span className="mr-3"><MonitorIcon size={16} /></span>
                        Auto
                        {theme === 'auto' && <span className="ml-auto"><CheckIcon size={16} /></span>}
                      </button>
                      <button
                        onClick={() => {setTheme('light'); setShowThemeMenu(false)}}
                        className={`flex items-center w-full px-4 py-2 text-sm text-left ${theme === 'light' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                      >
                        <span className="mr-3"><SunIcon size={16} /></span>
                        Light
                        {theme === 'light' && <span className="ml-auto"><CheckIcon size={16} /></span>}
                      </button>
                      <button
                        onClick={() => {setTheme('dark'); setShowThemeMenu(false)}}
                        className={`flex items-center w-full px-4 py-2 text-sm text-left ${theme === 'dark' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                      >
                        <span className="mr-3"><MoonIcon size={16} /></span>
                        Dark
                        {theme === 'dark' && <span className="ml-auto"><CheckIcon size={16} /></span>}

                    <h3 className="text-lg font-bold text-gray-800 dark:text-white flex items-center">
                        <PaletteIcon className="mr-2 text-indigo-500" size={20}/>
                        Customize Wheel Colors
                    </h3>
                    <button onClick={() => setShowColorModal(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><Icon size={20}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon></button>
                </div>

                <div className="space-y-4 mb-4">
                    {/* Option: Default */}
                    <label className={`flex items-start p-3 rounded-lg border cursor-pointer transition ${tempColorType === 'default' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : 'border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50'}`}>
                        <input
                            type="radio"
                            name="colorType"
                            checked={tempColorType === 'default'}
                            onChange={() => setTempColorType('default')}
                            className="mt-1 mr-3"
                        />
                        <div>
                            <span className="block font-medium text-gray-800 dark:text-white">Default Rainbow</span>
                            <span className="text-xs text-gray-500 dark:text-gray-400">The standard colorful palette.</span>
                            <div className="flex mt-2 space-x-1">
                                {defaultColors.slice(0, 6).map(c => (
                                    <div key={c} className="w-4 h-4 rounded-full" style={{backgroundColor: c}}></div>
                                ))}
                            </div>
                        </div>
                    </label>

                    {/* Option: Custom */}
                    <label className={`flex items-start p-3 rounded-lg border cursor-pointer transition ${tempColorType === 'custom' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : 'border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50'}`}>
                        <input
                            type="radio"
                            name="colorType"
                            checked={tempColorType === 'custom'}
                            onChange={() => setTempColorType('custom')}
                            className="mt-1 mr-3"
                        />
                        <div className="flex-grow">
                            <span className="block font-medium text-gray-800 dark:text-white">Custom Hex List</span>
                            <span className="text-xs text-gray-500 dark:text-gray-400">Enter hex codes (e.g. #F00, #00F)</span>

                            {tempColorType === 'custom' && (
                                <>
                                    <div className="flex mt-2 space-x-1 min-h-[1rem] flex-wrap gap-y-1">
                                        {customColorPreview.map((c, i) => (
                                            <div key={i} className="w-4 h-4 rounded-full border border-gray-200 dark:border-gray-600 shadow-sm" style={{backgroundColor: c}}></div>
                                        ))}
                                    </div>
                                    <textarea
                                        value={tempCustomColors}
                                        onChange={(e) => setTempCustomColors(e.target.value)}
                                        placeholder="#FF0000, #00FF00, #0000FF"
                                        rows={3}
                                        className={`w-full mt-2 p-2 text-sm border rounded focus:ring-2 font-mono transition-colors ${isCustomColorInvalid ? 'border-red-500 focus:ring-red-500 focus:border-red-500' : 'border-gray-300 dark:border-gray-600 focus:ring-indigo-500'} dark:bg-gray-700 dark:text-white`}
                                        onClick={(e) => e.stopPropagation()}
                                    />
                                    {isCustomColorInvalid && <p className="text-xs text-red-500 mt-1">Please enter valid hex codes (e.g. #FF5733).</p>}
                                </>
                            )}
                        </div>
                    </label>
                </div>

                <div className="flex justify-end space-x-2">
                    <button onClick={() => setShowColorModal(false)} className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                    <button
                        onClick={saveColors}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                    >
                        Save Colors
                    </button>
                </div>
              </div>
            </div>
          )}

          {/* AI Generator Modal */}
          {showGenModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 max-w-md w-full border dark:border-gray-700 transform scale-100 animate-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-gray-800 dark:text-white flex items-center">
                        <SparklesIcon className="mr-2 text-indigo-500" size={20}/>
                        AI List Generator
                    </h3>
                    <button onClick={() => setShowGenModal(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><Icon size={20}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon></button>
                </div>
                <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
                    Describe what you want (e.g., "Lunch ideas for Indonesians who wants to lose weight but have given up on diet and exercise", "Excuses for being late", "Very spicy truth or dare questions").
                </p>
                <textarea
                    value={genPrompt}
                    onChange={(e) => setGenPrompt(e.target.value)}
                    placeholder="Enter a topic..."
                    rows={2}
                    className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white resize-none"
                    onKeyDown={(e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            generateList();
                        }
                    }}
                    autoFocus
                />
                <div className="flex justify-end space-x-2">
                    <button onClick={() => setShowGenModal(false)} className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                    <button
                        onClick={generateList}
                        disabled={isGenerating || !genPrompt.trim()}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg flex items-center disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        {isGenerating ? (
                            <>
                                <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Generating...
                            </>
                        ) : (
                            <>Generate <SparklesIcon size={16} className="ml-2"/></>
                        )}
                    </button>
                </div>
              </div>
            </div>
          )}

          {/* Help Modal */}
          {showHelpModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 max-w-md w-full border dark:border-gray-700 transform scale-100 animate-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-gray-800 dark:text-white flex items-center">
                        <HelpCircleIcon className="mr-2 text-indigo-500" size={20}/>
                        Weighted Items Guide
                    </h3>
                    <button onClick={() => setShowHelpModal(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><Icon size={20}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon></button>
                </div>
                <div className="text-sm text-gray-600 dark:text-gray-300 space-y-3">
                    <p>You can customize the probability of each item winning by assigning a <strong>weight</strong>.</p>
                    <div className="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border border-gray-200 dark:border-gray-600 font-mono text-xs">
                        <p><span className="text-indigo-600 dark:text-indigo-400">Pizza:10</span> <span className="text-gray-400">// Very likely (10x chance)</span></p>
                        <p><span className="text-indigo-600 dark:text-indigo-400">Burger</span> <span className="text-gray-400">// Default weight is 1</span></p>
                    </div>
                    <ul className="list-disc list-inside space-y-1">
                        <li>Format: <code>Item Name:Weight</code></li>
                        <li>Higher number = Larger slice on the wheel.</li>
                        <li>If no number is specified, it defaults to <strong>1</strong>.</li>
                    </ul>
                </div>
                <div className="mt-6 flex justify-end">
                    <button onClick={() => setShowHelpModal(false)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">Got it</button>
                </div>
              </div>
            </div>
          )}

          {/* API Key Modal */}
          {showApiKeyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 max-w-md w-full border dark:border-gray-700 transform scale-100 animate-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-gray-800 dark:text-white flex items-center">
                        <KeyIcon className="mr-2 text-indigo-500" size={20}/>
                        Gemini API Key
                    </h3>
                    <button onClick={() => setShowApiKeyModal(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><Icon size={20}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon></button>
                </div>
                <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
                    To use AI features like the <strong>List Generator</strong> and <strong>Voice Announcer</strong>, you need a valid Google Gemini API key.
                </p>
                <div className="mb-4">
                    <label className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">API Key</label>
                    <input
                        type="password"
                        value={tempApiKey}
                        onChange={(e) => setTempApiKey(e.target.value)}
                        placeholder="Enter your API key here..."
                        className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                        autoFocus
                    />
                    <p className="text-xs text-gray-400 mt-1">
                        Your key is stored locally in your browser and is never shared.
                    </p>
                </div>
                <div className="flex justify-end space-x-2">
                    <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                    <button
                        onClick={saveApiKey}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                    >
                        Save Key
                    </button>
                </div>
              </div>
            </div>
          )}

          {/* OUT OF ORDER OVERLAY */}
          {isOutOfOrder && (
              <div className="fixed inset-0 z-[9999] bg-black/90 flex items-center justify-center overflow-hidden cursor-not-allowed backdrop-blur-sm">

                  {/* Sparks Generator */}
                  <div className="absolute inset-0 overflow-hidden pointer-events-none">
                      {Array.from({ length: 20 }).map((_, i) => (
                          <div
                              key={i}
                              className="absolute w-1 h-8 bg-yellow-200 rounded-full"
                              style={{
                                  left: `${Math.random() * 100}%`,
                                  top: `${Math.random() * 100}%`,
                                  opacity: 0,
                                  animation: `sparkFlash ${0.2 + Math.random() * 0.5}s infinite`,
                                  animationDelay: `${Math.random() * 2}s`,
                                  transformOrigin: 'center',
                                  boxShadow: '0 0 10px #fff, 0 0 20px #fbbf24'
                              }}
                          ></div>
                      ))}
                  </div>

                  <div className="relative border-8 border-gray-800 bg-gray-900 p-10 rounded-xl shadow-2xl transform -rotate-2 max-w-lg text-center">
                      {/* Metal bolts */}
                      <div className="absolute top-2 left-2 w-4 h-4 bg-gray-400 rounded-full shadow-inner border border-gray-600"></div>
                      <div className="absolute top-2 right-2 w-4 h-4 bg-gray-400 rounded-full shadow-inner border border-gray-600"></div>
                      <div className="absolute bottom-2 left-2 w-4 h-4 bg-gray-400 rounded-full shadow-inner border border-gray-600"></div>
                      <div className="absolute bottom-2 right-2 w-4 h-4 bg-gray-400 rounded-full shadow-inner border border-gray-600"></div>

                      <h1
                        className="text-6xl md:text-7xl font-black text-transparent bg-clip-text uppercase tracking-tighter mb-4"
                        style={{
                            color: 'rgba(255, 0, 0, 0.1)',
                            WebkitTextStroke: '2px #ff0000',
                            animation: 'neonFlicker 4s infinite alternate',
                            fontFamily: 'Courier New, monospace'
                        }}
                      >
                        OUT OF ORDER
                      </h1>

                      <div className="text-red-500 font-mono text-lg tracking-widest opacity-80 animate-pulse">
                          SYSTEM FAILURE // OVERHEAT
                      </div>

                      <div className="mt-8 p-4 bg-black/50 border border-red-900/50 rounded text-red-400/60 text-xs font-mono">
                          ERROR_CODE: 0xDEAD_WHEEL <br/>
                          CHECKSUM: JEΔFREYSA?ELi <br/>
                          Please refresh to reboot system.
                      </div>

                      {/* Hanging wire effect */}
                      <svg className="absolute -bottom-20 right-10 w-12 h-24 text-gray-700" viewBox="0 0 20 50">
                          <path d="M10 0 Q 5 25 15 50" stroke="currentColor" strokeWidth="4" fill="none" />
                          <circle cx="15" cy="50" r="2" fill="red" className="animate-pulse"/>
                      </svg>
                  </div>
              </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
