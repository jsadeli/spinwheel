<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpinWheel - Customizable Picker Wheel</title>

  <!-- Tailwind CSS with Dark Mode Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Animations */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    body {
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* Scrollbar styling for the text area */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: transparent;
    }
    textarea::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark textarea::-webkit-scrollbar-thumb {
      background: #475569;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .dark textarea::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline Icons ---
    const Icon = ({ children, size = 24, className = "" }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
      >
        {children}
      </svg>
    );

    const SettingsIcon = (props) => (
      <Icon {...props}>
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </Icon>
    );

    const Volume2Icon = (props) => (
      <Icon {...props}>
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </Icon>
    );

    const VolumeXIcon = (props) => (
      <Icon {...props}>
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </Icon>
    );

    const ShuffleIcon = (props) => (
      <Icon {...props}>
        <polyline points="16 3 21 3 21 8"/>
        <line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/>
        <line x1="15" y1="15" x2="21" y2="21"/>
        <line x1="4" y1="4" x2="9" y2="9"/>
      </Icon>
    );

    const Trash2Icon = (props) => (
      <Icon {...props}>
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <line x1="10" y1="11" x2="10" y2="17"/>
        <line x1="14" y1="11" x2="14" y2="17"/>
      </Icon>
    );

    const TrophyIcon = (props) => (
      <Icon {...props}>
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </Icon>
    );

    const SunIcon = (props) => (
      <Icon {...props}>
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </Icon>
    );

    const MoonIcon = (props) => (
      <Icon {...props}>
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </Icon>
    );

    const MonitorIcon = (props) => (
      <Icon {...props}>
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
        <line x1="8" y1="21" x2="16" y2="21" />
        <line x1="12" y1="17" x2="12" y2="21" />
      </Icon>
    );

    const CheckIcon = (props) => (
      <Icon {...props}>
        <polyline points="20 6 9 17 4 12" />
      </Icon>
    );

    const GithubIcon = (props) => (
      <Icon {...props}>
        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
      </Icon>
    );

    const ShareIcon = (props) => (
      <Icon {...props}>
        <circle cx="18" cy="5" r="3" />
        <circle cx="6" cy="12" r="3" />
        <circle cx="18" cy="19" r="3" />
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
      </Icon>
    );

    const CopyIcon = (props) => (
      <Icon {...props}>
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </Icon>
    );

    const ClockIcon = (props) => (
      <Icon {...props}>
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </Icon>
    );

    const EyeIcon = (props) => (
      <Icon {...props}>
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </Icon>
    );

    const EyeOffIcon = (props) => (
      <Icon {...props}>
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </Icon>
    );

    // Confetti Logic
    const fireConfetti = () => {
      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
      const confettiCount = 150;
      const container = document.createElement('div');
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.width = '100%';
      container.style.height = '100%';
      container.style.pointerEvents = 'none';
      container.style.zIndex = '9999';
      document.body.appendChild(container);

      for (let i = 0; i < confettiCount; i++) {
        const el = document.createElement('div');
        el.style.position = 'absolute';
        el.style.width = '10px';
        el.style.height = '10px';
        el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-10px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        el.style.transform = `rotate(${Math.random() * 360}deg)`;

        const animationDuration = 1 + Math.random() * 2;
        el.style.transition = `top ${animationDuration}s ease-in, transform ${animationDuration}s linear`;
        container.appendChild(el);

        setTimeout(() => {
          el.style.top = '110vh';
          el.style.transform = `rotate(${Math.random() * 360 + 360}deg)`;
        }, 100);
      }

      setTimeout(() => {
        document.body.removeChild(container);
      }, 4000);
    };

    const App = () => {
      const [items, setItems] = useState([
        "Pizza", "Burger", "Sushi", "Tacos", "Salad", "Pasta", "Steak", "Ramen"
      ]);
      const [inputText, setInputText] = useState(items.join('\n'));
      const [isSpinning, setIsSpinning] = useState(false);
      const [winner, setWinner] = useState(null);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [theme, setTheme] = useState('auto'); // 'auto', 'light', 'dark'
      const [showThemeMenu, setShowThemeMenu] = useState(false);
      const [showShareMenu, setShowShareMenu] = useState(false);
      const [shareUrl, setShareUrl] = useState('');
      const [history, setHistory] = useState([]);
      const [activeTab, setActiveTab] = useState('inputs'); // 'inputs' or 'history'
      const [hideLabels, setHideLabels] = useState(false);
      const [isCopied, setIsCopied] = useState(false);

      // Refs for animation loop
      const canvasRef = useRef(null);
      const rotationRef = useRef(0);
      const isSpinningRef = useRef(false);
      const itemsRef = useRef(items);
      const velocityRef = useRef(0);
      const winnerRef = useRef(null);
      const isDarkModeRef = useRef(false);
      const themeMenuRef = useRef(null);
      const shareMenuRef = useRef(null);
      const spinFrameRef = useRef(null); // Capture requestAnimationFrame ID
      const hideLabelsRef = useRef(false);

      // Audio Refs
      const audioCtxRef = useRef(null);
      const lastTickRef = useRef(0);

      // Initialize from URL parameters if present
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const encodedList = params.get('list');
        if (encodedList) {
          try {
            const decodedList = decodeURIComponent(escape(atob(encodedList)));
            setInputText(decodedList);

            // Clean URL without reloading
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({path: newUrl}, '', newUrl);
          } catch (e) {
            console.error("Failed to decode list from URL", e);
          }
        }
      }, []);

      // Sync items ref for the animation loop
      useEffect(() => {
        itemsRef.current = items;
      }, [items]);

      // Sync spinning ref
      useEffect(() => {
        isSpinningRef.current = isSpinning;
      }, [isSpinning]);

      // Sync winner ref
      useEffect(() => {
        winnerRef.current = winner;
      }, [winner]);

      // Sync hide labels ref
      useEffect(() => {
        hideLabelsRef.current = hideLabels;
      }, [hideLabels]);

      // Theme Logic
      useEffect(() => {
        const root = window.document.documentElement;
        const checkSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = false;

        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'light') {
          isDark = false;
        } else {
          isDark = checkSystemTheme();
        }

        if (isDark) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        isDarkModeRef.current = isDark;
      }, [theme]);

      // Click outside to close dropdowns
      useEffect(() => {
        const handleClickOutside = (event) => {
            if (themeMenuRef.current && !themeMenuRef.current.contains(event.target)) {
                setShowThemeMenu(false);
            }
            if (shareMenuRef.current && !shareMenuRef.current.contains(event.target)) {
                setShowShareMenu(false);
            }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => {
            document.removeEventListener("mousedown", handleClickOutside);
        };
      }, []);

      const getThemeIcon = () => {
        if (theme === 'auto') return <MonitorIcon size={24} />;
        if (theme === 'light') return <SunIcon size={24} />;
        return <MoonIcon size={24} />;
      };

      const handleOpenShare = () => {
        if (!showShareMenu) {
          try {
            const baseUrl = window.location.href.split('?')[0];
            const encoded = btoa(unescape(encodeURIComponent(inputText)));
            setShareUrl(`${baseUrl}?list=${encoded}`);
          } catch (e) {
            console.error("Failed to encode list", e);
            setShareUrl("Error generating link");
          }
        }
        setShowShareMenu(!showShareMenu);
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          setIsCopied(true);
          setTimeout(() => setIsCopied(false), 2000);
        });
      };

      // --- AUDIO LOGIC ---
      const initAudio = () => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
      };

      const playTickSound = () => {
        if (!soundEnabled || !audioCtxRef.current) return;
        const ctx = audioCtxRef.current;

        // Create oscillator for a short "wood block" click
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        // Pitch glides down slightly for a punchier sound
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      };

      const playWinSound = () => {
        if (!soundEnabled || !audioCtxRef.current) return;
        const ctx = audioCtxRef.current;
        const now = ctx.currentTime;

        // Helper for playing a tone
        const playTone = (freq, start, dur, type = 'triangle', vol = 0.1) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(vol, start + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + dur);
        };

        // A major fanfare sequence (C Major)
        // Fast run up
        playTone(523.25, now + 0.0, 0.3, 'square', 0.1); // C5
        playTone(659.25, now + 0.1, 0.3, 'square', 0.1); // E5
        playTone(783.99, now + 0.2, 0.3, 'square', 0.1); // G5

        // The "Ta-Da" finale (Chord)
        playTone(523.25, now + 0.3, 1.5, 'triangle', 0.15); // C5
        playTone(659.25, now + 0.3, 1.5, 'triangle', 0.15); // E5
        playTone(783.99, now + 0.3, 1.5, 'triangle', 0.15); // G5
        playTone(1046.50, now + 0.3, 2.0, 'sawtooth', 0.1); // C6 (Top Note, sharper)
      };

      const colors = [
        '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
        '#FFEEAD', '#FFD93D', '#FF9A8B', '#A0E7E5',
        '#B39CD0', '#FBE7C6', '#EB6B56', '#E056FD'
      ];

      // Update items from text area
      useEffect(() => {
        const list = inputText.split('\n').filter(item => item.trim() !== '');
        setItems(list);
      }, [inputText]);

      // MAIN RENDER LOOP
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const render = () => {
          const width = canvas.width;
          const height = canvas.height;
          const centerX = width / 2;
          const centerY = height / 2;
          const radius = Math.min(width, height) / 2 - 10;
          const currentItems = itemsRef.current;
          const isDark = isDarkModeRef.current;
          const shouldHide = hideLabelsRef.current;

          // --- Idle Spin Logic ---
          if (!isSpinningRef.current && currentItems.length > 0 && velocityRef.current === 0 && !winnerRef.current) {
            rotationRef.current = (rotationRef.current + 0.002) % (2 * Math.PI);
            lastTickRef.current = rotationRef.current;
          }

          // --- Drawing ---
          ctx.clearRect(0, 0, width, height);

          if (currentItems.length === 0) {
            // Empty State
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#334155' : '#f0f0f0';
            ctx.fill();
            ctx.strokeStyle = isDark ? '#475569' : '#ddd';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = isDark ? '#94a3b8' : '#888';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Add items to spin!', centerX, centerY);
          } else {
            // Draw Wheel
            const sliceAngle = (2 * Math.PI) / currentItems.length;

            currentItems.forEach((item, index) => {
              const startAngle = index * sliceAngle + rotationRef.current;
              const endAngle = (index + 1) * sliceAngle + rotationRef.current;

              ctx.beginPath();
              ctx.moveTo(centerX, centerY);
              ctx.arc(centerX, centerY, radius, startAngle, endAngle);
              ctx.closePath();

              ctx.fillStyle = colors[index % colors.length];
              ctx.fill();
              ctx.stroke();

              // Draw text
              ctx.save();
              ctx.translate(centerX, centerY);
              ctx.rotate(startAngle + sliceAngle / 2);
              ctx.textAlign = "right";
              ctx.fillStyle = "#fff";
              ctx.font = currentItems.length > 12 ? "bold 14px Arial" : "bold 18px Arial";

              const textToDraw = shouldHide ? "?" : item;
              const displayText = shouldHide ? "?" : (item.substring(0, 18) + (item.length > 18 ? '...' : ''));

              ctx.fillText(displayText, radius - 20, 5);
              ctx.restore();
            });

            // Hub
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#1e293b' : 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Border
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.stroke();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      const spinWheel = () => {
        if (isSpinning || items.length === 0) return;

        // Initialize audio on user interaction
        initAudio();

        setIsSpinning(true);
        setWinner(null);

        // Reset tracking for ticks
        lastTickRef.current = rotationRef.current;

        // Physics variables
        velocityRef.current = Math.random() * 0.2 + 0.5; // Random initial speed

        // Dynamically calculate friction to force exactly 10 seconds duration
        // Formula: friction = (v_final / v_initial)^(1 / total_frames)
        const duration = 10000; // 10 seconds
        const stopThreshold = 0.0001; // Lower threshold for a smoother stop
        const totalFrames = duration / 16.667; // approx 600 frames at 60fps
        const baseFriction = Math.pow(stopThreshold / velocityRef.current, 1 / totalFrames);

        let lastTime = performance.now();

        const animateSpin = (currentTime) => {
          // Calculate time difference (Delta Time)
          const dt = currentTime - lastTime;
          lastTime = currentTime;

          // Normalize to 60fps (approx 16.67ms per frame)
          const frameRatio = dt / 16.67;

          // Apply friction scaled by time
          velocityRef.current *= Math.pow(baseFriction, frameRatio);

          // "Grinding" effect at low speeds
          if (velocityRef.current < 0.05 && velocityRef.current > 0.001) {
            const wobble = Math.sin(currentTime / 50) * (velocityRef.current * 0.5);
            rotationRef.current += wobble;
          }

          // Update rotation based on time passed
          rotationRef.current += velocityRef.current * frameRatio;

          // --- TICK SOUND LOGIC ---
          // Check if we passed a segment boundary
          const sliceAngle = (2 * Math.PI) / itemsRef.current.length;
          const currentStep = Math.floor(rotationRef.current / sliceAngle);
          const lastStep = Math.floor(lastTickRef.current / sliceAngle);

          if (currentStep !== lastStep) {
             playTickSound();
          }
          lastTickRef.current = rotationRef.current;
          // ------------------------

          // Continue animation if velocity is above threshold
          if (velocityRef.current > stopThreshold) {
            spinFrameRef.current = requestAnimationFrame(animateSpin);
          } else {
            // Animation complete
            velocityRef.current = 0;
            setIsSpinning(false);
            calculateWinner(rotationRef.current);
          }
        };

        spinFrameRef.current = requestAnimationFrame(animateSpin);
      };

      const handleStopSpin = () => {
        if (spinFrameRef.current) {
            cancelAnimationFrame(spinFrameRef.current);
            spinFrameRef.current = null;
        }
        setIsSpinning(false);
        velocityRef.current = 0;
      };

      const calculateWinner = (finalRotation) => {
        const normalizedRotation = finalRotation % (2 * Math.PI);
        const sliceAngle = (2 * Math.PI) / items.length;

        let effectiveAngle = (2 * Math.PI - normalizedRotation) % (2 * Math.PI);
        if (effectiveAngle < 0) effectiveAngle += 2 * Math.PI;

        const winningIndex = Math.floor(effectiveAngle / sliceAngle);
        const winItem = items[winningIndex];

        setWinner(winItem);

        // Add to history
        setHistory(prev => [{
            id: Date.now(),
            text: winItem,
            timestamp: new Date()
        }, ...prev]);

        if (soundEnabled) {
           playWinSound();
        }
        fireConfetti();
      };

      const handleShuffle = () => {
        const shuffled = [...items].sort(() => Math.random() - 0.5);
        setInputText(shuffled.join('\n'));
      };

      const handleClear = () => {
        if(confirm("Are you sure you want to clear the list?")) {
          setInputText("");
        }
      };

      return (
        <div className="min-h-screen bg-gray-100 dark:bg-gray-900 flex flex-col font-sans text-gray-800 dark:text-gray-100 transition-colors duration-300">

          {/* Header */}
          <header className="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center z-50 border-b dark:border-gray-700 transition-colors duration-300">
            <div className="flex items-center space-x-2">
              <div className="bg-indigo-600 text-white p-2 rounded-lg">
                <SettingsIcon size={24} />
              </div>
              <h1 className="text-xl md:text-2xl font-bold text-indigo-900 dark:text-indigo-400">SpinWheel</h1>
            </div>
            <div className="flex items-center space-x-2">

              {/* GitHub Link */}
              <a
                href="https://github.com/samuelkripto/spin-wheel"
                target="_blank"
                rel="noopener noreferrer"
                className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300"
                title="View on GitHub"
              >
                <GithubIcon size={24} />
              </a>

              {/* Theme Dropdown */}
              <div className="relative" ref={themeMenuRef}>
                <button
                  onClick={() => setShowThemeMenu(!showThemeMenu)}
                  className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400"
                  title="Theme Settings"
                >
                  {getThemeIcon()}
                </button>

                {showThemeMenu && (
                  <div className="absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 z-50 overflow-hidden animate-[fade-in_0.2s_ease-out]">
                    <div className="py-1">
                      <button
                        onClick={() => {setTheme('auto'); setShowThemeMenu(false)}}
                        className={`flex items-center w-full px-4 py-2 text-sm text-left ${theme === 'auto' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                      >
                        <span className="mr-3"><MonitorIcon size={16} /></span>
                        Auto
                        {theme === 'auto' && <span className="ml-auto"><CheckIcon size={16} /></span>}
                      </button>
                      <button
                        onClick={() => {setTheme('light'); setShowThemeMenu(false)}}
                        className={`flex items-center w-full px-4 py-2 text-sm text-left ${theme === 'light' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                      >
                        <span className="mr-3"><SunIcon size={16} /></span>
                        Light
                        {theme === 'light' && <span className="ml-auto"><CheckIcon size={16} /></span>}
                      </button>
                      <button
                        onClick={() => {setTheme('dark'); setShowThemeMenu(false)}}
                        className={`flex items-center w-full px-4 py-2 text-sm text-left ${theme === 'dark' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                      >
                        <span className="mr-3"><MoonIcon size={16} /></span>
                        Dark
                        {theme === 'dark' && <span className="ml-auto"><CheckIcon size={16} /></span>}
                      </button>
                    </div>
                  </div>
                )}
              </div>

              <button
                onClick={() => setSoundEnabled(!soundEnabled)}
                className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300"
                title={soundEnabled ? "Mute Sound" : "Enable Sound"}
              >
                {soundEnabled ? <Volume2Icon size={24} /> : <VolumeXIcon size={24} />}
              </button>

              {/* Share Menu */}
              <div className="relative" ref={shareMenuRef}>
                <button
                  onClick={handleOpenShare}
                  className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400"
                  title="Share / Export List"
                >
                  <ShareIcon size={24} />
                </button>

                {showShareMenu && (
                  <div className="absolute right-0 mt-2 w-80 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 z-50 p-4 animate-[fade-in_0.2s_ease-out]">
                    <h3 className="text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Share this Wheel</h3>
                    <div className="flex space-x-2">
                      <input
                        type="text"
                        readOnly
                        value={shareUrl}
                        className="flex-grow p-2 text-sm border border-gray-300 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                      />
                      <button
                        onClick={copyToClipboard}
                        className={`p-2 rounded transition flex items-center justify-center ${isCopied ? 'bg-green-500 hover:bg-green-600 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}
                        title={isCopied ? "Copied!" : "Copy to Clipboard"}
                      >
                        {isCopied ? <CheckIcon size={18} /> : <CopyIcon size={18} />}
                      </button>
                    </div>
                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-2">
                      Copy this link to share your current list with others.
                    </p>
                  </div>
                )}
              </div>

            </div>
          </header>

          <main className="flex-grow flex flex-col md:flex-row overflow-hidden">

            {/* Left Panel: The Wheel */}
            <div className="flex-1 flex flex-col items-center justify-center p-4 relative min-h-[50vh]">

              {/* Pointer Triangle */}
              <div className="absolute z-20 right-0 md:right-auto top-1/2 -translate-y-1/2 translate-x-1/2 md:translate-x-[210px] lg:translate-x-[260px] filter drop-shadow-lg pointer-events-none">
                <div className="w-0 h-0 border-t-[20px] border-t-transparent border-r-[40px] border-r-red-600 border-b-[20px] border-b-transparent transform md:rotate-0"></div>
              </div>

              <div className="relative">
                <canvas
                  ref={canvasRef}
                  width={500}
                  height={500}
                  className="max-w-full h-auto max-h-[60vh] md:max-h-[80vh] w-full object-contain filter drop-shadow-xl"
                />

                {/* Mystery Toggle Button */}
                <button
                  onClick={() => setHideLabels(!hideLabels)}
                  className="absolute bottom-2 right-2 p-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-full shadow-md hover:bg-gray-50 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 z-30"
                  title={hideLabels ? "Show Items" : "Hide Items (Mystery Mode)"}
                >
                  {hideLabels ? <EyeIcon size={20} /> : <EyeOffIcon size={20} />}
                </button>

                {/* Center Spin Button Overlay */}
                <button
                  onClick={isSpinning ? handleStopSpin : spinWheel}
                  disabled={items.length === 0}
                  className={`absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2
                      w-20 h-20 rounded-full bg-white dark:bg-gray-800 border-4 shadow-lg
                      flex items-center justify-center font-black text-xl tracking-wider
                      hover:scale-105 active:scale-95 transition-all z-30
                      ${isSpinning
                        ? 'border-red-500 dark:border-red-400 text-red-600 dark:text-red-400'
                        : 'border-indigo-600 dark:border-indigo-400 text-indigo-700 dark:text-indigo-400 animate-pulse'}
                      ${items.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}`}
                >
                  {isSpinning ? "STOP" : "SPIN"}
                </button>
              </div>
            </div>

            {/* Right Panel: Controls */}
            <div className="w-full md:w-96 bg-white dark:bg-gray-800 border-l border-gray-200 dark:border-gray-700 flex flex-col h-[50vh] md:h-auto z-10 shadow-xl md:shadow-none transition-colors duration-300">

              {/* Tabs */}
              <div className="flex border-b border-gray-200 dark:border-gray-700">
                <button
                  onClick={() => setActiveTab('inputs')}
                  className={`flex-1 p-4 font-bold text-sm flex items-center justify-center transition-colors relative ${activeTab === 'inputs' ? 'text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800'}`}
                >
                  <SettingsIcon size={16} className="mr-2"/>
                  Inputs <span className="ml-1 text-xs bg-gray-200 dark:bg-gray-700 px-1.5 py-0.5 rounded-full">{items.length}</span>
                  {activeTab === 'inputs' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-indigo-600 dark:bg-indigo-400"></div>}
                </button>
                <button
                  onClick={() => setActiveTab('history')}
                  className={`flex-1 p-4 font-bold text-sm flex items-center justify-center transition-colors relative ${activeTab === 'history' ? 'text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800'}`}
                >
                  <ClockIcon size={16} className="mr-2"/>
                  History <span className="ml-1 text-xs bg-gray-200 dark:bg-gray-700 px-1.5 py-0.5 rounded-full">{history.length}</span>
                  {activeTab === 'history' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-indigo-600 dark:bg-indigo-400"></div>}
                </button>
              </div>

              {/* Content Area */}
              {activeTab === 'inputs' ? (
                <>
                  <div className="flex-grow p-4 overflow-hidden flex flex-col">
                    <label className="text-sm text-gray-500 dark:text-gray-400 mb-2 block">Enter text (one item per line):</label>
                    <textarea
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      className="flex-grow w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none font-mono text-sm shadow-inner bg-gray-50 dark:bg-gray-700 dark:text-gray-100 transition-colors"
                      placeholder="Enter items here..."
                    />
                  </div>

                  <div className="p-4 border-t border-gray-200 dark:border-gray-700 grid grid-cols-2 gap-3 bg-gray-50 dark:bg-gray-900/50">
                    <button
                      onClick={handleShuffle}
                      className="flex items-center justify-center px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-medium transition shadow-sm"
                    >
                      <ShuffleIcon className="w-4 h-4 mr-2" /> Shuffle
                    </button>
                    <button
                      onClick={handleClear}
                      className="flex items-center justify-center px-4 py-2 bg-white dark:bg-gray-800 border border-red-200 dark:border-red-900/50 text-red-600 dark:text-red-400 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 font-medium transition shadow-sm"
                    >
                      <Trash2Icon className="w-4 h-4 mr-2" /> Clear
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <div className="flex-grow overflow-y-auto p-4">
                    {history.length === 0 ? (
                      <div className="h-full flex flex-col items-center justify-center text-gray-400 dark:text-gray-500">
                        <ClockIcon size={48} className="mb-4 opacity-20"/>
                        <p className="text-sm">No history yet.</p>
                        <p className="text-xs mt-1">Spin the wheel to see results here.</p>
                      </div>
                    ) : (
                      <ul className="space-y-2">
                        {history.map((item) => (
                          <li key={item.id} className="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border border-gray-100 dark:border-gray-700 flex justify-between items-center animate-[fade-in_0.3s_ease-out]">
                            <span className="font-medium text-gray-800 dark:text-gray-200 truncate pr-4">{item.text}</span>
                            <span className="text-xs text-gray-400 dark:text-gray-500 whitespace-nowrap">
                              {item.timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}
                            </span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                  <div className="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50">
                    <button
                      onClick={() => {
                        if(confirm("Clear entire history?")) setHistory([]);
                      }}
                      className="w-full flex items-center justify-center px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-medium transition shadow-sm"
                      disabled={history.length === 0}
                    >
                      <Trash2Icon className="w-4 h-4 mr-2" /> Clear History
                    </button>
                  </div>
                </>
              )}
            </div>
          </main>

          {/* Winner Modal */}
          {winner && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-in fade-in duration-300">
              <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center transform scale-100 animate-in zoom-in-95 duration-300 relative overflow-hidden border dark:border-gray-700">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

                <div className="mx-auto w-16 h-16 bg-yellow-100 dark:bg-yellow-900/30 rounded-full flex items-center justify-center mb-4 text-yellow-600 dark:text-yellow-500">
                  <TrophyIcon size={32} />
                </div>

                <h3 className="text-gray-500 dark:text-gray-400 uppercase tracking-widest text-sm font-bold mb-2">We have a winner!</h3>
                <div className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 mb-8 break-words">
                  {winner}
                </div>

                <div className="grid grid-cols-1 gap-3">
                  <button
                    onClick={() => setWinner(null)}
                    className="w-full py-3 bg-gray-900 dark:bg-gray-700 text-white rounded-xl font-bold hover:bg-gray-800 dark:hover:bg-gray-600 transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                  >
                    Close
                  </button>
                  <button
                    onClick={() => {
                      // Remove winner logic
                      const newItems = items.filter(i => i !== winner);
                      setInputText(newItems.join('\n'));
                      setWinner(null);
                    }}
                    className="w-full py-3 bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 rounded-xl font-bold hover:border-red-200 dark:hover:border-red-800 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition"
                  >
                    Remove & Spin Again
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
