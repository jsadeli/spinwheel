  <!-- Dynamic Favicon/Icon Generation -->
  <script>
    (function() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><circle cx="256" cy="256" r="256" fill="#4f46e5"/><path d="M256 256 256 0 A256 256 0 0 1 477.7 128 Z" fill="#fbbf24"/><path d="M256 256 477.7 128 A256 256 0 0 1 477.7 384 Z" fill="#ec4899"/><path d="M256 256 477.7 384 A256 256 0 0 1 256 512 Z" fill="#10b981"/><path d="M256 256 256 512 A256 256 0 0 1 34.3 384 Z" fill="#3b82f6"/><path d="M256 256 34.3 384 A256 256 0 0 1 34.3 128 Z" fill="#8b5cf6"/><path d="M256 256 34.3 128 A256 256 0 0 1 256 0 Z" fill="#ef4444"/><circle cx="256" cy="256" r="40" fill="#fff"/></svg>`;
      const iconUrl = "data:image/svg+xml;base64," + btoa(iconSvg);

      // Set Favicon
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = iconUrl;

      // Set Apple Touch Icon
      let appleLink = document.querySelector("link[rel='apple-touch-icon']");
      if (!appleLink) {
        appleLink = document.createElement('link');
        appleLink.rel = 'apple-touch-icon';
        document.head.appendChild(appleLink);
      }
      appleLink.href = iconUrl;

      // Generate Manifest
      const manifest = {
        "name": "SpinWheel",
        "short_name": "SpinWheel",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#ffffff",
        "theme_color": "#4f46e5",
        "icons": [
          {
            "src": iconUrl,
            "sizes": "512x512",
            "type": "image/svg+xml",
            "purpose": "any maskable"
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
      const manifestUrl = URL.createObjectURL(manifestBlob);

      let manifestLink = document.querySelector("link[rel='manifest']");
      if (!manifestLink) {
        manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        document.head.appendChild(manifestLink);
      }
      manifestLink.href = manifestUrl;
    })();
  </script>

    // Confetti Logic - Fireworks Style Physics
    const fireConfetti = () => {
      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
      const confettiCount = 250; // Increased count slightly for explosion effect
      const container = document.createElement('div');
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.width = '100%';
      container.style.height = '100%';
      container.style.pointerEvents = 'none';
      container.style.zIndex = '9999';
      container.style.perspective = '1000px'; // Depth for 3D
      document.body.appendChild(container);

      const particles = [];
      const startX = window.innerWidth / 2;
      // Start slightly below center to align better with the modal center
      const startY = window.innerHeight / 2 + 50;

      for (let i = 0; i < confettiCount; i++) {
        const el = document.createElement('div');
        el.style.position = 'absolute';
        el.style.left = '0'; // Positioning handled by translate3d
        el.style.top = '0';

        // Random size and shape
        const size = Math.random() * 8 + 6 + 'px';
        el.style.width = size;
        el.style.height = Math.random() > 0.5 ? size : (Math.random() * 4 + 4 + 'px'); // Square or rectangle

        const colorHex = colors[Math.floor(Math.random() * colors.length)];
        el.style.backgroundColor = colorHex;
        const startOpacity = 0.7 + Math.random() * 0.2; // Semi-transparent (70-90%)
        el.style.opacity = startOpacity.toString();
        el.style.willChange = 'transform, opacity'; // Optimization

        container.appendChild(el);

        // Physics Initialization
        // Explosion mechanics: random angle, random upward force
        const angle = Math.random() * Math.PI * 2; // Random direction around center
        const explosionForce = Math.random() * 15 + 10; // Random power

        // Initial velocities based on angle and force
        // Ensure a strong upward bias (negative Y) for the "pop"
        let vx = Math.cos(angle) * explosionForce * (Math.random() * 0.8 + 0.2);
        let vy = -Math.abs(Math.sin(angle) * explosionForce) - (Math.random() * 15 + 10);

        particles.push({
          el,
          x: startX,
          y: startY,
          vx: vx,
          vy: vy,
          gravity: 0.07 + Math.random() * 0.05, // Reduced gravity (was ~0.5) for floaty fall
          drag: 0.96, // Increased drag (was 0.98) for air resistance
          rotX: Math.random() * 360,
          rotY: Math.random() * 360,
          rotZ: Math.random() * 360,
          rotSpeedX: (Math.random() - 0.5) * 15, // Tumble speed
          rotSpeedY: (Math.random() - 0.5) * 15,
          rotSpeedZ: (Math.random() - 0.5) * 10,
          opacity: startOpacity,
          fadeStart: Date.now() + 3000 + Math.random() * 2000 // Start fading later (after 3-5s)
        });
      }

      let animationFrameId;
      const startTime = Date.now();

      // Physics Animation Loop
      const animate = () => {
        const now = Date.now();
        let activeParticles = 0;

        particles.forEach(p => {
          // Apply physics
          p.vy += p.gravity; // Apply gravity
          p.vx *= p.drag;    // Apply air resistance
          p.vy *= p.drag;

          p.x += p.vx;
          p.y += p.vy;

          // Apply rotation
          p.rotX += p.rotSpeedX;
          p.rotY += p.rotSpeedY;
          p.rotZ += p.rotSpeedZ;

          // Update DOM styling using translate3d for performance
          // We subtract half width/height to center the rotation point
          p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotateX(${p.rotX}deg) rotateY(${p.rotY}deg) rotateZ(${p.rotZ}deg)`;

          // Fade out logic
          if (now > p.fadeStart) {
              p.opacity -= 0.015;
              p.el.style.opacity = Math.max(0, p.opacity);
          }

          // Check if particle is still visible on screen
          if (p.y < window.innerHeight + 50 && p.opacity > 0) {
              activeParticles++;
          }
        });

        // Continue animation if particles are active and under time limit (increased to 20s)
        if (activeParticles > 0 && (now - startTime < 20000)) {
           animationFrameId = requestAnimationFrame(animate);
        } else {
           // Cleanup
           if (document.body.contains(container)) {
             document.body.removeChild(container);
           }
        }
      };

      animate();
    };

    // Helper function to load state from localStorage
    const loadState = (key, defaultValue) => {
        if (typeof window === 'undefined') return defaultValue;
        try {
            const stored = localStorage.getItem(key);
            return stored !== null ? JSON.parse(stored) : defaultValue;
        } catch (e) {
            console.error(`Failed to load ${key} from localStorage`, e);
            return defaultValue;
        }
    };

    // Helper for relative time
    const getRelativeTime = (date) => {
      if (!date) return '';
      const now = new Date();
      const diffInSeconds = Math.floor((now - new Date(date)) / 1000);
      const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });

      if (diffInSeconds < 60) return 'just now'; // cosmetic preference for very recent events
      // OR use: return rtf.format(-diffInSeconds, 'second');

      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return rtf.format(-diffInMinutes, 'minute');

      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return rtf.format(-diffInHours, 'hour');

      const diffInDays = Math.floor(diffInHours / 24);
      if (diffInDays < 7) return rtf.format(-diffInDays, 'day');

      const diffInWeeks = Math.floor(diffInDays / 7);
      if (diffInWeeks < 4) return rtf.format(-diffInWeeks, 'week');

      const diffInMonths = Math.floor(diffInDays / 30);
      if (diffInMonths < 12) return rtf.format(-diffInMonths, 'month');

      const diffInYears = Math.floor(diffInDays / 365);
      return rtf.format(-diffInYears, 'year');
    };

    const App = () => {
      const defaultItems = [
        "Pizza", "Burger", "Sushi", "Tacos", "Salad", "Pasta", "Steak", "Ramen"
      ];

      // Helper to parse text into objects { text, weight }
      const parseItems = (text) => {
        return text.split('\n')
          .filter(line => line.trim() !== '')
          .map(line => {
            // Check for "Text: Number" pattern
            // CHANGED: Added \s* to allow spaces between colon and number (e.g. "Pizza: 10")
            const match = line.match(/^(.*):\s*(\d+)$/);
            if (match) {
              const weight = parseInt(match[2], 10);
              if (!isNaN(weight) && weight > 0) {
                return { text: match[1].trim(), weight: weight, original: line.trim() };
              }
            }
            return { text: line.trim(), weight: 1, original: line.trim() };
          });
      };

      // Helper to convert item objects back to string for text area
      const itemsToString = (itemsArray) => {
        return itemsArray.map(i => {
            // If the current parsed text + weight matches the original input format, preserve it
            // Otherwise reconstruct it
            return i.weight > 1 ? `${i.text}: ${i.weight}` : i.text;
        }).join('\n');
      };

      // Load states from localStorage or defaults
      const [inputText, setInputText] = useState(() => loadState('spinWheel_inputs', defaultItems.join('\n')));

      // Items is now an array of objects: { text: string, weight: number }
      const [items, setItems] = useState(() => parseItems(loadState('spinWheel_inputs', defaultItems.join('\n'))));

      const [history, setHistory] = useState(() => {
          const storedHistory = loadState('spinWheel_history', []);
          // Rehydrate timestamp strings back to Date objects
          return storedHistory.map(item => ({
              ...item,
              timestamp: new Date(item.timestamp)
          }));
      });
      const [soundEnabled, setSoundEnabled] = useState(() => loadState('spinWheel_sound', true));
      const [theme, setTheme] = useState(() => loadState('spinWheel_theme', 'auto'));
      const [spinDuration, setSpinDuration] = useState(() => loadState('spinWheel_duration', 10000));
      const [hideLabels, setHideLabels] = useState(() => loadState('spinWheel_hideLabels', false));
      const [aiVoiceEnabled, setAiVoiceEnabled] = useState(() => loadState('spinWheel_aiVoice', false));
      const [geminiApiKey, setGeminiApiKey] = useState(() => loadState('spinWheel_apiKey', ''));

      const [isSpinning, setIsSpinning] = useState(false);
      const [winner, setWinner] = useState(null);
      const [showThemeMenu, setShowThemeMenu] = useState(false);
      const [showShareMenu, setShowShareMenu] = useState(false);
      const [showSettingsMenu, setShowSettingsMenu] = useState(false);
      const [shareUrl, setShareUrl] = useState('');
      const [activeTab, setActiveTab] = useState('inputs'); // 'inputs' or 'history'
      const [isCopied, setIsCopied] = useState(false);
      const [showGenModal, setShowGenModal] = useState(false);
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [showApiKeyModal, setShowApiKeyModal] = useState(false); // New: API Key Modal
      const [genPrompt, setGenPrompt] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [tempApiKey, setTempApiKey] = useState(''); // For editing key

      // Power Meter State
      const [isCharging, setIsCharging] = useState(false);
      const [chargePower, setChargePower] = useState(0);

      // REFS
      const chargeIntervalRef = useRef(null);
      const isChargingRef = useRef(false); // Ref to track charging status synchronously
      const chargePowerRef = useRef(0);    // Ref to track power synchronously
      const canvasRef = useRef(null);
      const rotationRef = useRef(0);
      const isSpinningRef = useRef(false); // Tracks spin status synchronously
      const itemsRef = useRef(items);
      const velocityRef = useRef(0);
      const winnerRef = useRef(null);
      const isDarkModeRef = useRef(false);
      const themeMenuRef = useRef(null);
      const shareMenuRef = useRef(null);
      const settingsMenuRef = useRef(null);
      const spinFrameRef = useRef(null); // Capture requestAnimationFrame ID
      const hideLabelsRef = useRef(hideLabels);
      const pointerRef = useRef(null); // Ref for the arrow pointer

      // Audio Refs
      const audioCtxRef = useRef(null);
      const lastTickRef = useRef(0);

      // State to force re-render for relative time updates
      const [, setTick] = useState(0);

      // Interval to update relative times every 30 seconds
      useEffect(() => {
        const timer = setInterval(() => {
          setTick(t => t + 1);
        }, 30000);
        return () => clearInterval(timer);
      }, []);

      // Initialize from URL parameters if present
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const encodedList = params.get('list');
        if (encodedList) {
          try {
            const decodedList = decodeURIComponent(escape(atob(encodedList)));
            setInputText(decodedList);

            // Clean URL without reloading
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({path: newUrl}, '', newUrl);
          } catch (e) {
            console.error("Failed to decode list from URL", e);
          }
        }
      }, []);

      // Persistence Effects - Save to localStorage on change
      useEffect(() => {
          localStorage.setItem('spinWheel_inputs', JSON.stringify(inputText));
      }, [inputText]);

      useEffect(() => {
          localStorage.setItem('spinWheel_history', JSON.stringify(history));
      }, [history]);

      useEffect(() => {
          localStorage.setItem('spinWheel_sound', JSON.stringify(soundEnabled));
      }, [soundEnabled]);

      useEffect(() => {
          localStorage.setItem('spinWheel_theme', JSON.stringify(theme));
      }, [theme]);

      useEffect(() => {
          localStorage.setItem('spinWheel_duration', JSON.stringify(spinDuration));
      }, [spinDuration]);

      useEffect(() => {
          localStorage.setItem('spinWheel_hideLabels', JSON.stringify(hideLabels));
      }, [hideLabels]);

      useEffect(() => {
          localStorage.setItem('spinWheel_aiVoice', JSON.stringify(aiVoiceEnabled));
      }, [aiVoiceEnabled]);

      useEffect(() => {
          localStorage.setItem('spinWheel_apiKey', JSON.stringify(geminiApiKey));
      }, [geminiApiKey]);


      // Sync items ref for the animation loop & Update Items State
      useEffect(() => {
        const parsed = parseItems(inputText);
        setItems(parsed);
        itemsRef.current = parsed;
      }, [inputText]);

      // Sync spinning ref
      useEffect(() => {
        isSpinningRef.current = isSpinning;
      }, [isSpinning]);

      // Sync winner ref
      useEffect(() => {
        winnerRef.current = winner;
      }, [winner]);

      // Sync hide labels ref
      useEffect(() => {
        hideLabelsRef.current = hideLabels;
      }, [hideLabels]);

      // Theme Logic
      useEffect(() => {
        const root = window.document.documentElement;
        const checkSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = false;

        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'light') {
          isDark = false;
        } else {
          isDark = checkSystemTheme();
        }

        if (isDark) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        isDarkModeRef.current = isDark;
      }, [theme]);

      // Click outside to close dropdowns
      useEffect(() => {
        const handleClickOutside = (event) => {
            if (themeMenuRef.current && !themeMenuRef.current.contains(event.target)) {
                setShowThemeMenu(false);
            }
            if (shareMenuRef.current && !shareMenuRef.current.contains(event.target)) {
                setShowShareMenu(false);
            }
            if (settingsMenuRef.current && !settingsMenuRef.current.contains(event.target)) {
                setShowSettingsMenu(false);
            }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => {
            document.removeEventListener("mousedown", handleClickOutside);
        };
      }, []);

      const getThemeIcon = () => {
        if (theme === 'auto') return <MonitorIcon size={24} />;
        if (theme === 'light') return <SunIcon size={24} />;
        return <MoonIcon size={24} />;
      };

      const handleOpenShare = () => {
        if (!showShareMenu) {
          try {
            const baseUrl = window.location.href.split('?')[0];
            const encoded = btoa(unescape(encodeURIComponent(inputText)));
            setShareUrl(`${baseUrl}?list=${encoded}`);
          } catch (e) {
            console.error("Failed to encode list", e);
            setShareUrl("Error generating link");
          }
        }
        setShowShareMenu(!showShareMenu);
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          setIsCopied(true);
          setTimeout(() => setIsCopied(false), 2000);
        });
      };

      // --- LLM Logic ---
      const generateList = async () => {
        if (!genPrompt.trim() || !geminiApiKey) return;
        setIsGenerating(true);
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiApiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `You are a helper for a spin wheel app. Generate a weighted list of 8-12 short, creative items based on the user's request: "${genPrompt}". Return only the items, one per line. If you want to make some items more likely, add ": weight" (e.g. Pizza: 5) otherwise just the name. Do not include numbering or markdown blocks.`
                        }]
                    }]
                })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
                setInputText(text.trim());
                setShowGenModal(false);
                setGenPrompt('');
            }
        } catch (error) {
            console.error("Generation failed", error);
            alert(`Failed to generate list: ${error.message || "Unknown error"}`);
        } finally {
            setIsGenerating(false);
        }
      };

      const announceWinner = async (winnerText) => {
        if (!aiVoiceEnabled || !geminiApiKey) return;
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${geminiApiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `The winner is... ${winnerText}!` }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                    }
                })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            const audioContent = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (audioContent) {
                const audioBytes = Uint8Array.from(atob(audioContent), c => c.charCodeAt(0));
                // Basic WAV header construction for PCM data
                const wavHeader = new ArrayBuffer(44);
                const view = new DataView(wavHeader);
                const sampleRate = 24000;
                const numChannels = 1;
                const bitsPerSample = 16;

                const writeString = (offset, string) => {
                    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
                };

                writeString(0, 'RIFF');
                view.setUint32(4, 36 + audioBytes.length, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * 2, true);
                view.setUint16(32, numChannels * 2, true);
                view.setUint16(34, bitsPerSample, true);
                writeString(36, 'data');
                view.setUint32(40, audioBytes.length, true);

                const blob = new Blob([wavHeader, audioBytes], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);

                setTimeout(() => audio.play(), 500);
            }
        } catch (error) {
            console.error("TTS failed", error);
        }
      };

      const saveApiKey = () => {
          setGeminiApiKey(tempApiKey.trim());
          setShowApiKeyModal(false);
          setTempApiKey('');
          // If we just added a key, we can potentially re-enable voice
          if (tempApiKey.trim()) {
              // Optional: auto-enable voice? keeping it manual for now.
          } else {
              // If key cleared, disable voice
              setAiVoiceEnabled(false);
          }
      };

      // --- AUDIO LOGIC ---
      const initAudio = () => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
      };

      const playTickSound = () => {
        if (!soundEnabled || !audioCtxRef.current) return;
        const ctx = audioCtxRef.current;

        // Short, "plastic click" sound
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      };

      const playWinSound = () => {
        if (!soundEnabled || !audioCtxRef.current) return;
        const ctx = audioCtxRef.current;
        const now = ctx.currentTime;

        // Helper for playing a tone
        const playTone = (freq, start, dur, type = 'triangle', vol = 0.1) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(vol, start + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + dur);
        };

        // A major fanfare sequence (C Major)
        playTone(523.25, now + 0.0, 0.3, 'square', 0.1); // C5
        playTone(659.25, now + 0.1, 0.3, 'square', 0.1); // E5
        playTone(783.99, now + 0.2, 0.3, 'square', 0.1); // G5

        // The "Ta-Da" finale (Chord)
        playTone(523.25, now + 0.3, 1.5, 'triangle', 0.15); // C5
        playTone(659.25, now + 0.3, 1.5, 'triangle', 0.15); // E5
        playTone(783.99, now + 0.3, 1.5, 'triangle', 0.15); // G5
        playTone(1046.50, now + 0.3, 2.0, 'sawtooth', 0.1); // C6 (Top Note, sharper)
      };

      const colors = [
        '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
        '#FFEEAD', '#FFD93D', '#FF9A8B', '#A0E7E5',
        '#B39CD0', '#FBE7C6', '#EB6B56', '#E056FD'
      ];

      // MAIN RENDER LOOP
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const NUM_PINS = 30; // Fixed number of pins for the game show feel

        const render = () => {
          const width = canvas.width;
          const height = canvas.height;
          const centerX = width / 2;
          const centerY = height / 2;
          const radius = Math.min(width, height) / 2 - 20; // Leave room for pins
          const currentItems = itemsRef.current;
          const isDark = isDarkModeRef.current;
          const shouldHide = hideLabelsRef.current;

          // --- Idle Spin Logic ---
          if (!isSpinningRef.current && currentItems.length > 0 && velocityRef.current === 0 && !winnerRef.current) {
            rotationRef.current = (rotationRef.current + 0.002) % (2 * Math.PI);
            lastTickRef.current = rotationRef.current;
          }

          // --- Drawing ---
          ctx.clearRect(0, 0, width, height);

          if (currentItems.length === 0) {
            // Empty State
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#334155' : '#f0f0f0';
            ctx.fill();
            ctx.strokeStyle = isDark ? '#475569' : '#ddd';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = isDark ? '#94a3b8' : '#888';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Add items to spin!', centerX, centerY);
          } else {
            // Calculate Total Weight
            const totalWeight = currentItems.reduce((sum, item) => sum + item.weight, 0);

            // Draw Wheel Slices
            let currentAngle = rotationRef.current;

            currentItems.forEach((item, index) => {
              // Calculate slice size based on weight
              const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);

              const startAngle = currentAngle;
              const endAngle = currentAngle + sliceAngle;

              ctx.beginPath();
              ctx.moveTo(centerX, centerY);
              ctx.arc(centerX, centerY, radius, startAngle, endAngle);
              ctx.closePath();

              ctx.fillStyle = colors[index % colors.length];
              ctx.fill();
              ctx.stroke();

              // Draw text
              ctx.save();
              ctx.translate(centerX, centerY);
              // Rotate to center of the weighted slice
              ctx.rotate(startAngle + sliceAngle / 2);
              ctx.textAlign = "right";
              ctx.fillStyle = "#fff";
              ctx.font = currentItems.length > 12 ? "bold 14px Arial" : "bold 18px Arial";

              const displayText = shouldHide ? "?" : (item.text.substring(0, 18) + (item.text.length > 18 ? '...' : ''));

              ctx.fillText(displayText, radius - 20, 5);
              ctx.restore();

              // Advance angle for next item
              currentAngle += sliceAngle;
            });

            // Hub
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#1e293b' : 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Border
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Draw Pins
            const pinRadius = radius + 10; // Pins sit outside the main wheel
            for (let i = 0; i < NUM_PINS; i++) {
                const angle = (i * 2 * Math.PI / NUM_PINS) + rotationRef.current;
                const px = centerX + Math.cos(angle) * pinRadius;
                const py = centerY + Math.sin(angle) * pinRadius;

                ctx.beginPath();
                ctx.arc(px, py, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#C0C0C0'; // Silver pins
                ctx.fill();
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
          }

          // --- Pointer Animation Logic ---
          if (pointerRef.current) {
             const pinSpacing = (2 * Math.PI) / NUM_PINS;
             const pinPhase = (rotationRef.current % pinSpacing) / pinSpacing;

             let pointerAngle = 0;
             if (pinPhase > 0.85) {
                 pointerAngle = (pinPhase - 0.85) / 0.15 * -25;
             } else {
                 pointerAngle = -25 * Math.exp(-15 * pinPhase);
             }

             pointerRef.current.style.transform = `rotate(${pointerAngle}deg)`;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      // Power Meter Logic
      const handlePointerDown = (e) => {
        // Prevent default to stop text selection or scrolling
        if (e.cancelable) e.preventDefault();

        // CHANGED: Check the Ref instead of State to guarantee we see the true status instantly
        if (isSpinningRef.current) {
            handleStopSpin();
            return;
        }

        if (items.length === 0) return;

        // Start Charging
        isChargingRef.current = true;
        chargePowerRef.current = 0;

        setIsCharging(true);
        setChargePower(0);

        const startTime = Date.now();

        // Clear any existing interval just in case
        if (chargeIntervalRef.current) clearInterval(chargeIntervalRef.current);

        chargeIntervalRef.current = setInterval(() => {
            const elapsed = Date.now() - startTime;
            // Fill up in 1.5 seconds
            let power = Math.min(elapsed / 1500, 1);

            // Update both state (for visual) and ref (for logic)
            setChargePower(power);
            chargePowerRef.current = power;
        }, 16);
      };

      const stopCharging = () => {
        // Check synchronous ref to handle fast clicks
        if (!isChargingRef.current) return;

        isChargingRef.current = false;
        setIsCharging(false);

        if (chargeIntervalRef.current) {
            clearInterval(chargeIntervalRef.current);
            chargeIntervalRef.current = null;
        }

        // Use REF value to guarantee freshness regardless of render cycle
        const finalPower = Math.max(chargePowerRef.current, 0.02);
        spinWheel(finalPower);

        setChargePower(0);
        chargePowerRef.current = 0;
      };

      const cancelCharging = () => {
          if (isChargingRef.current) {
             stopCharging();
          }
      };

      const handlePointerUpOrLeave = (e) => {
         if (e && e.cancelable) e.preventDefault();
         stopCharging();
      };

      const spinWheel = (powerFactor = 1.0) => {
        // CHANGED: Check Ref here too for safety
        if (isSpinningRef.current || items.length === 0) return;

        initAudio();

        // CHANGED: Update Ref synchronously BEFORE state
        isSpinningRef.current = true;
        setIsSpinning(true);

        setWinner(null);
        lastTickRef.current = rotationRef.current;

        const baseSpeed = Math.random() * 0.2 + 0.5;
        velocityRef.current = baseSpeed * (0.05 + 0.95 * powerFactor);

        const maxDuration = spinDuration;
        const targetDuration = Math.max(500, maxDuration * powerFactor);
        const stopThreshold = 0.0001;
        const totalFrames = targetDuration / 16.667;
        const baseFriction = Math.pow(stopThreshold / velocityRef.current, 1 / totalFrames);

        let lastTime = performance.now();

        const animateSpin = (currentTime) => {
          const dt = currentTime - lastTime;
          lastTime = currentTime;
          const frameRatio = dt / 16.67;
          velocityRef.current *= Math.pow(baseFriction, frameRatio);

          if (velocityRef.current < 0.05 && velocityRef.current > 0.001) {
            const wobble = Math.sin(currentTime / 50) * (velocityRef.current * 0.15);
            rotationRef.current += wobble;
          }

          rotationRef.current += velocityRef.current * frameRatio;

          // --- TICK SOUND LOGIC ---
          const NUM_PINS = 30;
          const pinSpacing = (2 * Math.PI) / NUM_PINS;

          const currentStep = Math.floor(rotationRef.current / pinSpacing);
          const lastStep = Math.floor(lastTickRef.current / pinSpacing);

          if (currentStep !== lastStep) {
             playTickSound();
          }
          lastTickRef.current = rotationRef.current;

          if (velocityRef.current > stopThreshold) {
            spinFrameRef.current = requestAnimationFrame(animateSpin);
          } else {
            velocityRef.current = 0;

            // CHANGED: Update Ref synchronously
            isSpinningRef.current = false;
            setIsSpinning(false);

            calculateWinner(rotationRef.current);
          }
        };
        spinFrameRef.current = requestAnimationFrame(animateSpin);
      };

      const handleStopSpin = () => {
        if (spinFrameRef.current) {
            cancelAnimationFrame(spinFrameRef.current);
            spinFrameRef.current = null;
        }
        // CHANGED: Update Ref synchronously
        isSpinningRef.current = false;
        setIsSpinning(false);

        velocityRef.current = 0;
      };

      const calculateWinner = (finalRotation) => {
        const normalizedRotation = finalRotation % (2 * Math.PI);

        // Weighted Winner Calculation
        // 1. Calculate effective angle (Right side is 0, moves counter-clockwise relative to rotation)
        let effectiveAngle = (2 * Math.PI - normalizedRotation) % (2 * Math.PI);
        if (effectiveAngle < 0) effectiveAngle += 2 * Math.PI;

        // 2. Calculate total weight
        const currentItems = itemsRef.current;
        const totalWeight = currentItems.reduce((sum, item) => sum + item.weight, 0);

        // 3. Iterate to find which slice encompasses the effectiveAngle
        let accumulatedAngle = 0;
        let winItem = null;

        for (let i = 0; i < currentItems.length; i++) {
            const item = currentItems[i];
            const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);

            if (effectiveAngle >= accumulatedAngle && effectiveAngle < accumulatedAngle + sliceAngle) {
                winItem = item.text;
                break;
            }
            accumulatedAngle += sliceAngle;
        }

        // Fallback (should mostly not happen unless float precision error)
        if (!winItem && currentItems.length > 0) winItem = currentItems[currentItems.length - 1].text;

        setWinner(winItem);

        // Add to history
        setHistory(prev => {
            const newHistory = [{
                id: Date.now(),
                text: winItem,
                timestamp: new Date()
            }, ...prev];
            return newHistory;
        });

        if (soundEnabled) {
           playWinSound();
           if (aiVoiceEnabled && geminiApiKey) {
               announceWinner(winItem); // Call Gemini TTS only if enabled and key exists
           }
        }
        fireConfetti();
      };

      const handleShuffle = () => {
        const shuffled = [...items].sort(() => Math.random() - 0.5);
        setInputText(itemsToString(shuffled));
      };

      const handleClear = () => {
        if(confirm("Are you sure you want to clear the list?")) {
          setInputText("");
        }
      };

      return (
        // CHANGED: Added md:h-screen and md:overflow-hidden to lock desktop layout to viewport
        <div className="min-h-screen md:h-screen md:overflow-hidden bg-gray-100 dark:bg-gray-900 flex flex-col font-sans text-gray-800 dark:text-gray-100 transition-colors duration-300">

          {/* Header */}
          <header className="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center z-50 border-b dark:border-gray-700 transition-colors duration-300">
            <div className="flex items-center space-x-2">
              <div className="rounded-full overflow-hidden shadow-sm">
                <SpinWheelLogo size={40} />
              </div>
              <h1 className="text-xl md:text-2xl font-bold text-indigo-900 dark:text-indigo-400">SpinWheel</h1>
            </div>
            <div className="flex items-center space-x-2">

              {/* GitHub Link */}
              <a
                href="https://github.com/samuelkripto/spin-wheel"
                target="_blank"
                rel="noopener noreferrer"
                className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300"
                title="View on GitHub"
              >
                <GithubIcon size={24} />
              </a>

              {/* Theme Dropdown */}
              <div className="relative" ref={themeMenuRef}>
                <button
                  onClick={() => setShowThemeMenu(!showThemeMenu)}

                        {isGenerating ? (
                            <>
                                <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Generating...
                            </>
                        ) : (
                            <>Generate <SparklesIcon size={16} className="ml-2"/></>
                        )}
                    </button>
                </div>
              </div>
            </div>
          )}

          {/* Help Modal */}
          {showHelpModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 max-w-md w-full border dark:border-gray-700 transform scale-100 animate-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-gray-800 dark:text-white flex items-center">
                        <HelpCircleIcon className="mr-2 text-indigo-500" size={20}/>
                        Weighted Items Guide
                    </h3>
                    <button onClick={() => setShowHelpModal(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><Icon size={20}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon></button>
                </div>
                <div className="text-sm text-gray-600 dark:text-gray-300 space-y-3">
                    <p>You can customize the probability of each item winning by assigning a <strong>weight</strong>.</p>
                    <div className="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border border-gray-200 dark:border-gray-600 font-mono text-xs">
                        <p><span className="text-indigo-600 dark:text-indigo-400">Pizza:10</span> <span className="text-gray-400">// Very likely (10x chance)</span></p>
                        <p><span className="text-indigo-600 dark:text-indigo-400">Burger</span> <span className="text-gray-400">// Default weight is 1</span></p>
                    </div>
                    <ul className="list-disc list-inside space-y-1">
                        <li>Format: <code>Item Name:Weight</code></li>
                        <li>Higher number = Larger slice on the wheel.</li>
                        <li>If no number is specified, it defaults to <strong>1</strong>.</li>
                    </ul>
                </div>
                <div className="mt-6 flex justify-end">
                    <button onClick={() => setShowHelpModal(false)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">Got it</button>
                </div>
              </div>
            </div>
          )}

          {/* API Key Modal */}
          {showApiKeyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 max-w-md w-full border dark:border-gray-700 transform scale-100 animate-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-gray-800 dark:text-white flex items-center">
                        <KeyIcon className="mr-2 text-indigo-500" size={20}/>
                        Gemini API Key
                    </h3>
                    <button onClick={() => setShowApiKeyModal(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><Icon size={20}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon></button>
                </div>
                <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
                    To use AI features like the <strong>List Generator</strong> and <strong>Voice Announcer</strong>, you need a valid Google Gemini API key.
                </p>
                <div className="mb-4">
                    <label className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">API Key</label>
                    <input
                        type="password"
                        value={tempApiKey}
                        onChange={(e) => setTempApiKey(e.target.value)}
                        placeholder="Enter your API key here..."
                        className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                        autoFocus
                    />
                    <p className="text-xs text-gray-400 mt-1">
                        Your key is stored locally in your browser and is never shared.
                    </p>
                </div>
                <div className="flex justify-end space-x-2">
                    <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                    <button
                        onClick={saveApiKey}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                    >
                        Save Key
                    </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
