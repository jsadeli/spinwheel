    <!-- Error Handling for Loading Screen -->
    <script>
      (function () {
        const loader = document.getElementById("app-loader");
        const heading = loader?.querySelector("h2");
        if (!loader || !heading) return;

        const updateLoadingText = (msg) => {
          // If the loader is already hidden or removed, don't do anything
          if (loader.style.display === "none" || !document.body.contains(loader)) return;

          heading.textContent = msg;
          heading.classList.remove(
            "animate-pulse",
            "text-blue-900",
            "tracking-[0.3em]",
            "uppercase"
          );
          heading.classList.add("text-red-600", "font-mono", "text-sm", "px-4", "normal-case");

          // Deflate the ball
          const ball = loader.querySelector("div[style*='beachBounce']");
          const shadow = loader.querySelector("div[style*='shadowScale']");

          if (ball) {
            ball.style.animation = "none";
            ball.style.transition = "transform 0.5s ease-out, filter 0.5s";
            // Squish it down to sit on the ground
            ball.style.transform = "translateY(40px) scale(1.1, 0.8) rotate(-10deg)";

            const svg = ball.querySelector("svg");
            // Only apply the crumple effect once
            if (svg && !svg.querySelector("#crumple-clip")) {
              // 1. Define the Crumple Shape via ClipPath
              // This shape mimics a ball with the top-right caved in
              const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
              const clipPath = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
              clipPath.setAttribute("id", "crumple-clip");

              const clipShape = document.createElementNS("http://www.w3.org/2000/svg", "path");
              // Start top-left (ish), Big arc around bottom, curve into center for dent
              clipShape.setAttribute(
                "d",
                "M 60 140 A 240 240 0 1 0 450 140 C 350 260, 160 260, 60 140 Z"
              );
              clipPath.appendChild(clipShape);
              defs.appendChild(clipPath);
              svg.insertBefore(defs, svg.firstChild);

              // 2. Wrap existing content in a group with the clip-path
              const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
              group.setAttribute("clip-path", "url(#crumple-clip)");

              // Move all children (circles, paths) into the group
              // Iterate backwards to safely move nodes
              for (let i = svg.childNodes.length - 1; i >= 0; i--) {
                const node = svg.childNodes[i];
                if (node !== defs) {
                  // Don't move the defs we just added
                  group.insertBefore(node, group.firstChild);
                }
              }
              svg.appendChild(group);

              // 3. Add Shadow/Crease Overlay for the Dent
              // This draws over the "missing" part to show the folded material
              const crease = document.createElementNS("http://www.w3.org/2000/svg", "path");
              // Curve matching the dent in the clip path, plus some inner fold details
              crease.setAttribute(
                "d",
                "M 60 140 C 160 260, 350 260, 450 140 C 380 200, 150 200, 60 140 Z"
              );
              crease.setAttribute("fill", "#000"); // Shadow color
              crease.setAttribute("opacity", "0.3");
              crease.setAttribute("class", "crumple-shadow");
              svg.appendChild(crease);

              // 4. Add "cracks" or stress lines near the dent
              const stress = document.createElementNS("http://www.w3.org/2000/svg", "path");
              stress.setAttribute("d", "M 150 220 L 180 250 M 360 220 L 330 250");
              stress.setAttribute("stroke", "#000");
              stress.setAttribute("stroke-width", "4");
              stress.setAttribute("opacity", "0.2");
              stress.setAttribute("fill", "none");
              svg.appendChild(stress);
            }
          }

          if (shadow) {
            shadow.style.animation = "none";
            shadow.style.transform = "scale(1.2, 1)";
            shadow.style.opacity = "0.8";
          }
        };

        window.addEventListener(
          "error",
          (event) => {
            let msg = event.message;
            // Handle resource loading errors (which don't have a message property)
            if (
              !msg &&
              event.target &&
              (event.target.tagName === "SCRIPT" || event.target.tagName === "LINK")
            ) {
              msg = `Failed to load resource: ${event.target.src || event.target.href}`;
            }
            updateLoadingText(msg || "Unknown Error; check Console");
          },
          true
        );

        window.addEventListener("unhandledrejection", (event) => {
          updateLoadingText(event.reason?.message || event.reason || "Unhandled Promise Rejection");
        });

        const originalConsoleError = console.error;
        console.error = (...args) => {
          originalConsoleError.apply(console, args);
          const msg = args
            .map((arg) =>
              arg instanceof Error
                ? arg.message
                : typeof arg === "object"
                ? JSON.stringify(arg)
                : String(arg)
            )
            .join(" ");
          updateLoadingText(msg);
        };
      })();
    </script>

    <script type="text/babel" data-type="module">
      const {

        drawWheel,

        Stats,
        ChallengeManager,
        GeminiError,

        getPrestigeTheme,
        getTierColors,
        lerpColor,
        parseCustomColors,
        fireConfetti,
        fireSnowfall,
        spawnSmoke,
        processCommandCodes,
        loadState,
        getRelativeTime,
        parseItems,
        itemsToString,
        copyToClipboard,
        isEmoji,
        parseWinnerString,
        playWinSound,
        playJingleBells,
        playTickSound,
        playDefaultTickSound,
        playCrispWoodTickSound,
        playMetallicClankTickSound,
        playCrystalGlassTickSound,
        playFireCrackle,
        playBreakdownSound,
        playPurchaseSound,
        playBigPurchaseSound,
        base64ToWavBlob,
        ChargeSound,
        DEFAULT_LIST_NAME,
        DEFAULT_LIST_ITEMS,
        STORAGE_KEYS,
        THEMES,
        AI_VOICES,
        TOAST_DURATION,
        TAB_NAMES,
        GITHUB_LINK,
        TICK_SOUNDS,
        COLOR_ASSIGNMENT_MODE,
        DAILY_CHALLENGE_LEVEL,
        DAILY_CHALLENGE_RESET_HOUR,
        CoinChip,
        CoinStoreModal,
        effectiveItems,
        WheelPhysics,
        WHEEL_PRESETS,
        FLAPPER_TENSIONS,
        POINTER_SKINS,
      } = window;

      import React, { useState, useEffect, useRef, useMemo } from "react";
      import { createRoot } from "react-dom/client";

      const apiKey = ""; // Provided by environment

      const App = () => {
        // --- STATE MANAGEMENT ---

        // Load states from localStorage or defaults
        // We now manage a list of lists.
        // Legacy migration: if 'spinWheel_inputs' exists but 'spinWheel_savedLists' doesn't, migrate it.
        const [savedLists, setSavedLists] = useState(() => {
          const storedLists = loadState(STORAGE_KEYS.SAVED_LISTS, null);
          if (storedLists) return storedLists;

          // Migration / Default
          const legacyInput = loadState(STORAGE_KEYS.INPUTS, null);
          const initialContent = legacyInput !== null ? legacyInput : DEFAULT_LIST_ITEMS.join("\n");

          return [
            {
              id: "default",
              name: DEFAULT_LIST_NAME,
              content: initialContent,
            },
          ];
        });

        const [activeListId, setActiveListId] = useState(() =>
          loadState(STORAGE_KEYS.ACTIVE_LIST_ID, "default")
        );

        // Helper to get content safely
        const getActiveListContent = (lists, id) => {
          const list = lists.find((l) => l.id === id);
          return list ? list.content : "";
        };

        // Initialize input text from the active list, NOT direct localStorage
        const [inputText, setInputText] = useState(getActiveListContent(savedLists, activeListId));

        // Items is now an array of objects: { text: string, weight: number }
        const [items, setItems] = useState(() => parseItems(inputText));

        const [history, setHistory] = useState(() => {
          const storedHistory = loadState(STORAGE_KEYS.HISTORY, []);
          // Rehydrate timestamp strings back to Date objects
          return storedHistory.map((item) => ({
            ...item,
            timestamp: new Date(item.timestamp),
          }));
        });
        const [soundEnabled, setSoundEnabled] = useState(() =>
          loadState(STORAGE_KEYS.SOUND_ENABLED, true)
        );
        const [theme, setTheme] = useState(() =>
          loadState(STORAGE_KEYS.THEME, THEMES.AUTO)
        );
        const [spinDuration, setSpinDuration] = useState(() =>
          loadState(STORAGE_KEYS.SPIN_DURATION, 10000)
        );
        const [hideLabels, setHideLabels] = useState(() =>
          loadState(STORAGE_KEYS.HIDE_LABELS, false)
        );
        const [aiVoiceEnabled, setAiVoiceEnabled] = useState(() =>
          loadState(STORAGE_KEYS.AI_VOICE_ENABLED, false)
        );
        const [trailEnabled, setTrailEnabled] = useState(() =>
          loadState(STORAGE_KEYS.TRAIL_ENABLED, false)
        );
        const [geminiApiKey, setGeminiApiKey] = useState(() =>
          loadState(STORAGE_KEYS.GEMINI_API_KEY, "")
        );
        const [aiVoiceSelection, setAiVoiceSelection] = useState(() =>
          loadState(STORAGE_KEYS.AI_VOICE_SELECTION, AI_VOICES.AOEDE)
        );
        const [tickSound, setTickSound] = useState(() =>
          loadState(STORAGE_KEYS.TICK_SOUND, TICK_SOUNDS.DEFAULT)
        );
        const [flapperTension, setFlapperTension] = useState(() =>
          loadState(STORAGE_KEYS.FLAPPER_TENSION, FLAPPER_TENSIONS.NORMAL)
        );
        const [pointerSkin, setPointerSkin] = useState(() =>
          loadState(STORAGE_KEYS.POINTER_SKIN, POINTER_SKINS.CLASSIC.id)
        );

        // Color Settings
        const [colorSettings, setColorSettings] = useState(() =>
          loadState(STORAGE_KEYS.COLOR_SETTINGS, {
            type: "default",
            customColors: "#FF6B6B, #4ECDC4, #45B7D1",
          })
        );

        // Color Assignment Mode (Dynamic vs Deterministic)
        const [colorAssignment, setColorAssignment] = useState(() =>
          loadState(STORAGE_KEYS.COLOR_ASSIGNMENT, COLOR_ASSIGNMENT_MODE.DYNAMIC)
        );

        const [activeColors, setActiveColors] = useState(defaultColors);

        const [isSpinning, setIsSpinning] = useState(false);
        const [winner, setWinner] = useState(null);
        const [showThemeMenu, setShowThemeMenu] = useState(false);
        const [showShareMenu, setShowShareMenu] = useState(false);
        const [showSettingsMenu, setShowSettingsMenu] = useState(false);
        const [showListDropdown, setShowListDropdown] = useState(false);
        const [showColorModal, setShowColorModal] = useState(false);
        const [showCoinStoreModal, setShowCoinStoreModal] = useState(false);
        const [shareUrl, setShareUrl] = useState("");
        const [activeTab, setActiveTab] = useState(TAB_NAMES.INPUTS); // 'inputs', 'history', or 'progress'
        const [isCopied, setIsCopied] = useState(false);
        const [showGenModal, setShowGenModal] = useState(false);
        const [showHelpModal, setShowHelpModal] = useState(false);
        const [showApiKeyModal, setShowApiKeyModal] = useState(false); // API Key Modal
        const [genPrompt, setGenPrompt] = useState("");
        const [isGenerating, setIsGenerating] = useState(false);
        const [tempApiKey, setTempApiKey] = useState(""); // For editing key

        // Temp state for color editing
        const [tempColorType, setTempColorType] = useState("default");
        const [tempCustomColors, setTempCustomColors] = useState("");

        // Power Meter State
        const [isCharging, setIsCharging] = useState(false);
        const [chargePower, setChargePower] = useState(0);
        const [overchargeState, setOverchargeState] = useState(0); // State for overcharge animation
        const [isOutOfOrder, setIsOutOfOrder] = useState(false); // Broken state
        const [isCorrupted, setIsCorrupted] = useState(() =>
          loadState(STORAGE_KEYS.IS_CORRUPTED, false)
        ); // Corrupted state
        const [deferredPrompt, setDeferredPrompt] = useState(null);

        // Toast State (Queue System)
        const [toastQueue, setToastQueue] = useState([]);

        const addToast = (
          message,
          title = "Notification",
          icon = null,
          duration = TOAST_DURATION
        ) => {
          setToastQueue((prev) => [
            ...prev,
            { message, duration, title, icon, id: Date.now() + Math.random() },
          ]);
        };

        const closeToast = () => {
          setToastQueue((prev) => prev.slice(1));
        };

        // XP System State
        const [xp, setXp] = useState(() => loadState(STORAGE_KEYS.XP, 0));
        const [sessionSpin, setSessionSpin] = useState(0); // Track spins in this session (not persisted)
        const [totalSpins, setTotalSpins] = useState(() =>
          loadState(STORAGE_KEYS.TOTAL_SPINS, 0)
        ); // Track total spins
        const [cancelledSpins, setCancelledSpins] = useState(() =>
          loadState(STORAGE_KEYS.CANCELLED_SPINS, 0)
        ); // Track total cancelled spins

        // Track Tab Views for "Lorekeeper's Review"
        const [inputsTabViews, setInputsTabViews] = useState(() =>
          loadState(STORAGE_KEYS.INPUTS_TAB_VIEWS, 0)
        );
        const [historyTabViews, setHistoryTabViews] = useState(() =>
          loadState(STORAGE_KEYS.HISTORY_TAB_VIEWS, 0)
        );
        const [progressTabViews, setProgressTabViews] = useState(() =>
          loadState(STORAGE_KEYS.PROGRESS_TAB_VIEWS, 0)
        );

        // SpinCoin State
        const [coins, setCoins] = useState(() => {
          const coins = loadState(STORAGE_KEYS.COINS, null);
          if (coins != null) return coins;

          // if previous coin balance is not present, initialize based on total spins
          return loadState(STORAGE_KEYS.TOTAL_SPINS, 0);
        });

        // Initialize Managers
        const achievementManager = useMemo(() => new AchievementManager(), []);
        const challengeManager = useMemo(() => new ChallengeManager(), []);

        // State
        const [progressViewMode, setProgressViewMode] = useState(() => {
          const level = getLevelProgress(xp).level;
          return level >= DAILY_CHALLENGE_LEVEL ? "daily_quests" : "achievements";
        });
        const [achievements, setAchievements] = useState([]); // Store achievement objects with status
        const [achievementFilter, setAchievementFilter] = useState(AchievementFilters.ALL); // 'all', 'unlocked', 'locked'
        const [challenges, setChallenges] = useState([]);
        const [challengeFilter, setChallengeFilter] = useState(AchievementFilters.ALL);

        // User Level
        const levelInfo = getLevelProgress(xp);

        // Helper to gather current stats for achievement progress
        const getAchievementStats = () => {
          return {
            spins: totalSpins,
            level: levelInfo.level,
            historyLength: history.length,
            listCount: savedLists.length,
            cancelledSpins: cancelledSpins,
            consecutiveWins: Stats.calculateConsecutiveWins(history),
            consecutiveShuffles: consecutiveShufflesRef.current,
            inputsTabViews: inputsTabViews,
            historyTabViews: historyTabViews,
            progressTabViews: progressTabViews,
            sessionSpin: sessionSpin,
            spinsInLastMinute: spinTimestampsRef.current
              ? spinTimestampsRef.current.filter((t) => Date.now() - t < 60000).length
              : 0,
            spinsInLastHour: spinTimestampsRef.current ? spinTimestampsRef.current.length : 0,
            consecutiveOverheats: consecutiveOverheatsRef.current,
            unlockedCount: Object.keys(achievementManager.getUnlocked()).length,
            uniqueImportCount: loadState(STORAGE_KEYS.IMPORTED_CODES, []).length,
          };
        };

        // Load initial data & Update on changes
        useEffect(() => {
          const stats = getAchievementStats();
          setAchievements(achievementManager.getAll(stats));
          setChallenges(challengeManager.getAll({ xp, level: levelInfo.level }));
        }, [
          xp,
          levelInfo.level,
          totalSpins,
          history,
          savedLists,
          cancelledSpins,
          inputsTabViews,
          historyTabViews,
          progressTabViews,
          sessionSpin,
        ]);

        // Helper to handle achievement unlocks and XP gain
        const handleAchievementUnlocks = (newUnlocks) => {
          if (newUnlocks.length > 0) {
            let totalBonusXp = 0;
            newUnlocks.forEach((ach) => {
              const xpMsg = ach.bonusXp ? ` (+${ach.bonusXp} XP)` : "";
              addToast(`${ach.title}${xpMsg}`, "Achievement Unlocked", ach.icon, TOAST_DURATION);
              if (ach.bonusXp) totalBonusXp += ach.bonusXp;
            });

            setAchievements(achievementManager.getAll(getAchievementStats()));

            if (totalBonusXp > 0) {
              setXp((prev) => prev + totalBonusXp);
            }
          } else {
            // Even if no unlock, update state for progress bars
            setAchievements(achievementManager.getAll(getAchievementStats()));
          }
        };

        // Helper to handle daily challenge unlocks
        const handleDailyChallengeUnlocks = (newUnlocks) => {
          if (newUnlocks.length > 0) {
            let totalBonusXp = 0;
            newUnlocks.forEach((ch) => {
              const xpMsg = ch.bonusXp ? ` (+${ch.bonusXp} XP)` : "";
              addToast(`${ch.title}${xpMsg}`, "Daily Quest Completed", ch.icon, TOAST_DURATION);
              if (ch.bonusXp) totalBonusXp += ch.bonusXp;
            });

            setChallenges(challengeManager.getAll({ xp, level: levelInfo.level }));

            if (totalBonusXp > 0) {
              setXp((prev) => prev + totalBonusXp);
            }
          } else {
            // Even if no unlock, update state for progress bars
            setChallenges(challengeManager.getAll({ xp, level: levelInfo.level }));
          }
        };

        // Check history achievements on mount
        useEffect(() => {
          const newUnlocks = achievementManager.check({
            historyLength: history.length,
          });
          handleAchievementUnlocks(newUnlocks);
        }, []);

        // Level Up Toast Logic
        const prevLevelRef = useRef(levelInfo.level);

        useEffect(() => {
          if (levelInfo.level > prevLevelRef.current) {
            addToast(
              `You are now ${getLevelTitle(levelInfo.level)}!`,
              "Level Up!",
              null,
              TOAST_DURATION
            );
            // Optional: Trigger confetti if not already triggered by something else
            // fireConfetti();
          }
          prevLevelRef.current = levelInfo.level;
        }, [levelInfo.level]);

        // REFS
        const chargeIntervalRef = useRef(null);
        const pressTimerRef = useRef(null); // New ref for Tap vs Hold detection

        const resolveSkin = (id) =>

        const ensurePhysics = () => {

        const handleSettled = () => {

              !isChargingRef.current &&
              !isOutOfOrderRef.current &&
              !removingItemRef.current &&
              currentItems.length > 0 &&
              !winnerRef.current
            ) {
              // --- Idle Spin Logic ---
              // Pin coupling stays off here on purpose: a real flapper would simply block a
              // drift this slow, and the drift is attract-mode decoration rather than a spin.
              const targetIdleSpeed = 0.12; // rad/s
              const acceleration = 0.036; // rad/s^2
              idleVelocityRef.current = Math.min(
                idleVelocityRef.current + acceleration * dt,
                targetIdleSpeed
              );

              if (physics) {
                physics.drift(idleVelocityRef.current * dt);
                rotationRef.current = physics.theta;
              } else {
                rotationRef.current =
                  (rotationRef.current + idleVelocityRef.current * dt) % (2 * Math.PI);
              }
              velocityRef.current = 0;
            }

            // --- Removing Item Animation Logic ---
            if (removingItemRef.current) {
              const { startTime, duration } = removingItemRef.current;
              const now = Date.now();
              const progress = Math.min((now - startTime) / duration, 1);

              // Shrink the pin ring alongside the slice so pins never float over a gap.
              if (physics && effectiveItems) {
                physics.setItems(effectiveItems(currentItems, removingItemRef.current));
              }

              if (progress >= 1) {
                const itemToRemove = removingItemRef.current.text;
                const newItems = currentItems.filter((i) => i.text !== itemToRemove);
                removingItemRef.current = null;
                setTimeout(() => {
                  setInputText(itemsToString(newItems));
                }, 0);
              }
            }

            // --- Drawing ---
            if (drawWheel) {
              drawWheel(
                ctx,
                width,
                height,
                currentItems,
                currentColors,
                rotationRef.current,
                isDark,
                shouldHide,
                trailEnabledRef.current,
                velocityRef.current,
                removingItemRef.current,
                colorAssignmentRef.current,
                xpRef.current,
                physics ? physics.pins : null
              );
            }

            // --- Pointer Animation Logic ---
            if (pointerRef.current && updatePointer) {
              updatePointer(pointerRef.current, physics ? physics.flapperAngle() : 0);
            }

            animationFrameId = requestAnimationFrame(render);
          };

          animationFrameId = requestAnimationFrame(render);
          return () => cancelAnimationFrame(animationFrameId);
        }, []);

        // Power Meter Logic
        const handlePointerDown = (e) => {
          // Prevent default to stop text selection or scrolling
          if (e.cancelable) e.preventDefault();

          if (isOutOfOrder) return;

          // If currently spinning, stop it. Do NOT start a new charge/spin cycle.
          if (isSpinningRef.current) {
            handleStopSpin();
            return;
          }

          if (items.length === 0) {
            // Check "Into The Void"
            const newUnlocks = achievementManager.check({
              triedEmptySpin: true,
            });
            handleAchievementUnlocks(newUnlocks);
            return;
          }

          // Initialize audio context immediately on user interaction
          initAudio();

          // Reset power refs
          chargePowerRef.current = 0;
          setChargePower(0);
          setOverchargeState(0);
          isChargingRef.current = false;
          overchargeRef.current = 0; // Reset overcharge

          // Clear any existing hold timer
          if (pressTimerRef.current) clearTimeout(pressTimerRef.current);

          // Start delay timer. If user releases before this fires, it's a TAP.
          pressTimerRef.current = setTimeout(() => {
            // User held long enough: Start Charging
            isChargingRef.current = true;
            setIsCharging(true);

            // Start Audio
            startChargeSound();

            // Clear this timer ref so MouseUp knows we entered charging mode
            pressTimerRef.current = null;

            const startTime = Date.now();

            if (chargeIntervalRef.current) clearInterval(chargeIntervalRef.current);

            chargeIntervalRef.current = setInterval(() => {
              const elapsed = Date.now() - startTime;
              // Fill up in 1.5 seconds
              let power = Math.min(elapsed / 1500, 1);

              // If fully charged, start counting overcharge time
              if (power >= 1) {
                overchargeRef.current += 16; // Add ~16ms per frame
                setOverchargeState(overchargeRef.current); // Trigger re-render for heat animation
                spawnSmoke(smokeContainerRef, overchargeRef, () =>
                  playFireCrackle(audioCtxRef, soundEnabled, isOutOfOrder)
                );

                // Track Overheats for "This Is Fine"
                // We only want to count this ONCE per "press" when it enters the danger zone.
                // But this runs every frame.
                // We can check if overchargeRef.current just crossed a threshold?
                // Or just increment when we release if it was high enough?
                // The achievement says "Trigger the 'Overheating' button effect".
                // Smoke starts at 3000ms.
                // Let's count it if we release and it was > 3000ms.
                // See handlePointerUpOrLeave.

                // CHECK ACHIEVEMENT: Power Overwhelming
                // If we are shaking (power > 0.8) and charging, we might trigger it.
                // But the condition is "Hold the charge until the button shakes".
                // Let's check it when we release or here?
                // The condition in achievements.js is `stats.maxPowerCharge`.
                // We'll pass this flag when we check.

                // BREAKDOWN LOGIC: Overcharge > 15s (10s past Inferno start which is 5s)
                // Actually phase logic:
                // 0-3s (Safe)
                // 3-8s (Steam)
                // 8-13s (Smoke)
                // 13s+ (Inferno)
                // Let's break it 5 seconds AFTER Inferno starts (13s + 5s = 18s total overcharge time)
                if (overchargeRef.current > 18000) {
                  clearInterval(chargeIntervalRef.current);
                  chargeIntervalRef.current = null;

                  stopChargeSound();
                  playBreakdownSound(audioCtxRef, soundEnabled);

                  setIsCharging(false);
                  setChargePower(0);
                  setOverchargeState(0);
                  isChargingRef.current = false;

                  setIsOutOfOrder(true); // TRIGGER BROKEN STATE

                  // Check "0xDEAD_WHEEL"
                  const newUnlocks = achievementManager.check({
                    isBroken: true,
                  });
                  handleAchievementUnlocks(newUnlocks);
                  return;
                }
              }

              // Update sound pitch based on power AND overcharge time
              updateChargeSound(power, overchargeRef.current);

              // Update both state (for visual) and ref (for logic)
              setChargePower(power);
              chargePowerRef.current = power;
            }, 16);
          }, 200); // 200ms threshold for hold
        };

        const handlePointerUpOrLeave = (e) => {
          if (isOutOfOrder) return; // Dead interaction

          if (e && e.cancelable) e.preventDefault();

          // Case 1: User released QUICKLY (Tap)
          // pressTimerRef is still active, meaning the Hold threshold wasn't reached.
          if (pressTimerRef.current !== null) {
            clearTimeout(pressTimerRef.current);
            pressTimerRef.current = null;

            // Trigger Full Power Spin
            consecutiveOverheatsRef.current = 0; // Reset consecutive overheats on normal spin
            spinWheel(1.0);
            return;
          }

          // Case 2: User released after HOLDING (Power Meter was active)
          if (isChargingRef.current) {
            // Check for Power Overwhelming achievement
            // If power was > 0.8 (shaking threshold), we consider it "max power" enough for the achievement
            const wasMaxPower = chargePowerRef.current > 0.8;
            const wasOverheating = overchargeRef.current > 3000; // Smoke threshold

            if (wasOverheating) {
              consecutiveOverheatsRef.current += 1;
            } else {
              // If we didn't overheat, do we reset? "5 times in a row".
              // A "normal" charge (no smoke) should probably reset it.
              consecutiveOverheatsRef.current = 0;
            }

            stopCharging();

            const newUnlocks = achievementManager.check({
              maxPowerCharge: wasMaxPower,
              consecutiveOverheats: consecutiveOverheatsRef.current,
              spins: totalSpins,
              level: levelInfo.level,
            });
            handleAchievementUnlocks(newUnlocks);
            return;
          }
        };

        const stopCharging = () => {
          if (isOutOfOrder) return;

          // Check synchronous ref to handle fast clicks
          if (!isChargingRef.current) return;

          // Stop Audio
          stopChargeSound();

          isChargingRef.current = false;
          setIsCharging(false);

          if (chargeIntervalRef.current) {
            clearInterval(chargeIntervalRef.current);
            chargeIntervalRef.current = null;
          }

          // Use REF value to guarantee freshness regardless of render cycle
          // Reduced minimum power for a very gentle nudge
          const finalPower = Math.max(chargePowerRef.current, 0.02);
          spinWheel(finalPower);

          setChargePower(0);
          chargePowerRef.current = 0;
          overchargeRef.current = 0; // Reset smoke timer logic immediately
          setOverchargeState(0);
        };

        const cancelCharging = () => {
          if (isChargingRef.current) {
            stopCharging();
          }
        };

        const spinWheel = (powerFactor = 1.0) => {
          // Check Ref here too for safety
          if (isSpinningRef.current || items.length === 0) return;

          // --- DEBUG / CHEAT CODE SYSTEM ---
          const currentList = savedLists.find((l) => l.id === activeListId);
          if (currentList) {
            const shouldStop = processCommandCodes(currentList.name, inputText, {
              xp,
              setXp,
              setCoins,
              setIsCorrupted,
              setIsOutOfOrder,
              setTheme,
              setInputText,
              addToast,
              setWinner,
              achievementManager,
              setAchievements,
              challengeManager,
              setChallenges,
            });
            if (shouldStop) return;
          }

          // Track time since last spin for "AFK"
          const now = Date.now();
          if (lastSpinTimeRef.current) {
            timeSinceLastSpinRef.current = now - lastSpinTimeRef.current;
          } else {
            timeSinceLastSpinRef.current = 0;
          }
          lastSpinTimeRef.current = now;

          initAudio();

          // A settle beat from the previous spin may still be pending; drop it so the old
          // winner cannot pop up over the new spin.
          if (settleTimerRef.current) {
            clearTimeout(settleTimerRef.current);
            settleTimerRef.current = null;
          }

          // CHANGED: Update Ref synchronously BEFORE state
          isSpinningRef.current = true;
          setIsSpinning(true);

          setWinner(null);
          idleVelocityRef.current = 0; // Reset idle velocity for gradual startup after spin

          // Reset consecutive shuffles on spin
          consecutiveShufflesRef.current = 0;
          mysteryModeCancelledDuringSpinRef.current = false;

          // Reset consecutive overheats on successful spin
          // REMOVED: consecutiveOverheatsRef.current = 0; // Moved to handlePointerUpOrLeave to allow streaks

          // Track Spin Timestamp for "Analysis Paralysis" and "Button Masher"
          spinTimestampsRef.current = [...spinTimestampsRef.current, now].filter(
            (t) => now - t < 3600000
          ); // Keep last hour

          // Hand the spin to the solver. Duration is no longer imposed: it falls out of the
          // launch impulse, the wheel's inertia and everything the flapper takes back on the
          // way down, so powerFactor now buys rotations rather than seconds.
          const physics = ensurePhysics();
          if (!physics) {
            isSpinningRef.current = false;
            setIsSpinning(false);
            return;
          }

          physics.setPreset(spinDuration);
          physics.setTension(flapperTensionRef.current);
          physics.setSkin(resolveSkin(pointerSkinRef.current));
          physics.setItems(itemsRef.current);

          spinStartTimeRef.current = performance.now();
          spinTargetDurationRef.current = physics.launch(powerFactor);
        };

        const handleStopSpin = () => {
          if (physicsRef.current) physicsRef.current.cancel();
          if (settleTimerRef.current) {
            clearTimeout(settleTimerRef.current);
            settleTimerRef.current = null;
          }
          // Update Ref synchronously
          isSpinningRef.current = false;
          setIsSpinning(false);

          velocityRef.current = 0;

          // Increment cancelled spins
          setCancelledSpins((prev) => prev + 1);

          // We can't rely on 'cancelledSpins' state being updated immediately for the check below.
          // So we calculate it.
          const newCancelledCount = cancelledSpins + 1;

          // Calculate cancellation percentage
          const elapsed = performance.now() - spinStartTimeRef.current;
          const percentage =
            spinTargetDurationRef.current > 0 ? elapsed / spinTargetDurationRef.current : 0;

          // Check "First Cancel" achievement and "Premature Nope"
          const newUnlocks = achievementManager.check({
            isCancelledSpin: true,
            cancelledSpins: newCancelledCount,
            spinPercentage: percentage,
          });
          handleAchievementUnlocks(newUnlocks);
        };

        const calculateWinner = (finalRotation) => {
          const normalizedRotation = finalRotation % (2 * Math.PI);

          // Weighted Winner Calculation
          // 1. Calculate effective angle (Right side is 0, moves counter-clockwise relative to rotation)
          let effectiveAngle = (2 * Math.PI - normalizedRotation) % (2 * Math.PI);
          if (effectiveAngle < 0) effectiveAngle += 2 * Math.PI;

          // 2. Calculate total weight
          const currentItems = itemsRef.current;
          const totalWeight = currentItems.reduce((sum, item) => sum + item.weight, 0);

          // 3. Iterate to find which slice encompasses the effectiveAngle
          let accumulatedAngle = 0;
          let winItem = null;

          for (let i = 0; i < currentItems.length; i++) {
            const item = currentItems[i];
            const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);

            if (
              effectiveAngle >= accumulatedAngle &&
              effectiveAngle < accumulatedAngle + sliceAngle
            ) {
              winItem = item.text;
              break;
            }
            accumulatedAngle += sliceAngle;
          }

          // Fallback (should mostly not happen unless float precision error)
          if (!winItem && currentItems.length > 0)
            winItem = currentItems[currentItems.length - 1].text;

          setWinner(winItem);

          // Add to history
          setHistory((prev) => {
            const newHistory = [
              {
                id: Date.now(),
                text: winItem,
                timestamp: new Date(),
              },
              ...prev,
            ];
            return newHistory;
          });

          // Award XP
          setXp((prev) => prev + 1);
          setSessionSpin((prev) => prev + 1); // Track session spins
          setTotalSpins((prev) => prev + 1);

          // Check Achievements
          // We need the NEW total spins and level.
          // Since state updates are async, we calculate expected values.
          const newTotalSpins = totalSpins + 1;
          const newSessionSpin = sessionSpin + 1;
          // Level might change if XP crosses threshold.
          // Current XP is `xp`, new is `xp + 1`.
          const currentLevelInfo = getLevelProgress(xp); // Level at start of spin
          const newLevelInfo = getLevelProgress(xp + 1); // Level at end of spin

          // Check for consecutive wins
          // History has the NEWEST result at index 0 (after update).
          // But here `history` state is stale until next render.
          // We can check `winItem` against the PREVIOUS history item.
          const lastResult = history.length > 0 ? history[0].text : null;
          // Check for 3 in a row for "Deja Vu"
          let consecutiveWins = 1; // Start with 1 (current win)
          for (let i = 0; i < history.length; i++) {
            if (history[i].text === winItem) {
              consecutiveWins++;
            } else {
              break;
            }
          }

          // Calculate weights for "Never Tell Me The Odds" and "The House Always Wins"
          // const currentItems = itemsRef.current; // Already defined above
          const winnerObj = currentItems.find((i) => i.text === winItem);
          const winnerWeight = winnerObj ? winnerObj.weight : 1;
          const maxWeight = Math.max(...currentItems.map((i) => i.weight));
          const maxItemLength = Math.max(...currentItems.map((i) => i.text.length));
          const allIdentical =
            currentItems.length > 0 &&
            currentItems.every((item) => item.text === currentItems[0].text);

          const onlyEmojis =
            currentItems.length > 0 && currentItems.every((item) => isEmoji(item.text));

          const isUniqueList =
            currentItems.length > 0 &&
            new Set(currentItems.map((i) => i.text)).size === currentItems.length;

          const newUnlocks = achievementManager.check({
            spins: newTotalSpins,
            isCancelledSpin: false,
            level: currentLevelInfo.level, // current user level at the start of spin
            newLevel: newLevelInfo.level, // new user level after this spin
            sessionSpin: newSessionSpin,
            consecutiveWins: consecutiveWins,
            hasSpun: true,
            itemCount: currentItems.length,
            spinsInLastMinute: spinTimestampsRef.current.filter((t) => (spinTimestampsRef.current[spinTimestampsRef.current.length - 1] || Date.now()) - t < 60000).length,
            spinsInLastHour: spinTimestampsRef.current.length,
            winnerWeight: winnerWeight,
            maxWeight: maxWeight,
            maxItemLength: maxItemLength,
            allIdentical: allIdentical,
            onlyEmojis: onlyEmojis,
            isUniqueList: isUniqueList,
            historyLength: history.length + 1,
            mysteryMode: hideLabels,
            mysteryModeCancelledDuringSpin: mysteryModeCancelledDuringSpinRef.current,
            timeSinceLastSpin: timeSinceLastSpinRef.current,
            listCount: savedLists.length,
            usedAI: usedAIRef.current,
            soundMuted: !soundEnabled,
            trailEnabled: trailEnabled,
            spinDuration: spinDuration,
            winnerId: winItem, // Pass winner text as ID for checks like @about
            isDark: isDarkModeRef.current,
            isCustomColors: colorSettings.type === "custom",
            tickSound: tickSoundRef.current,
            unlockedCount: Object.keys(achievementManager.getUnlocked()).length,
          });
          handleAchievementUnlocks(newUnlocks);

          if (newUnlocks.length > 0) {
            // Check for meta achievements after unlocking
            const metaUnlocks = achievementManager.check({
              unlockedCount: Object.keys(achievementManager.getUnlocked()).length,
            });
            handleAchievementUnlocks(metaUnlocks);
          }

          // Check Daily Challenges
          // Only if user is high enough level
          if (currentLevelInfo.level >= DAILY_CHALLENGE_LEVEL) {
            const dailyUnlocks = challengeManager.incrementSpins({
              winner: winItem,
              level: currentLevelInfo.level,
              xp: xp,
              spins: newTotalSpins,
            });
            handleDailyChallengeUnlocks(dailyUnlocks);
          }

          // Christmas Season Logic: Dec 12 – Jan 6
          const now = new Date();
          const month = now.getMonth(); // 0-indexed (Jan=0, Dec=11)
          const day = now.getDate();
          const isChristmasSeason = (month === 11 && day >= 12) || (month === 0 && day <= 6);

          if (soundEnabled) {
            if (isChristmasSeason) {
              playJingleBells(audioCtxRef, soundEnabled);
            } else {
              playWinSound(audioCtxRef, soundEnabled);
            }
            if (aiVoiceEnabled && geminiApiKey) {
              announceWinner(winItem); // Call Gemini TTS only if enabled and key exists
            }
          }

          // Trigger animation if Level >= 7 ("Lord of the Spins")
          if (newLevelInfo.level >= 7) {
            if (isChristmasSeason) {
              fireSnowfall(); // Christmas Theme
            } else {
              fireConfetti(newLevelInfo.level); // Default Theme
            }
          }
        };

        const handleShuffle = () => {
          consecutiveShufflesRef.current += 1;
          const shuffled = [...items].sort(() => Math.random() - 0.5);
          setInputText(itemsToString(shuffled));

          // Check "Trust Issues" achievement
          const newUnlocks = achievementManager.check({
            usedShuffle: true,
            consecutiveShuffles: consecutiveShufflesRef.current,
            itemCount: items.length,
          });
          handleAchievementUnlocks(newUnlocks);
        };

        const handleClear = () => {
          if (confirm("Are you sure you want to clear the list?")) {
            setInputText("");
          }
        };

        // --- THEME & PRESTIGE LOGIC ---
        const prestigeTheme = getPrestigeTheme(levelInfo.level);

        // Get Tier Colors for Power Meter
        const tierColors = getTierColors(levelInfo.level);
        const isCosmic = levelInfo.level >= 11;

        // Calculate Heat Progress for Animation
        const overchargeTime = overchargeState;
        const heatThreshold = 3000;
        const maxHeatTime = 18000;
        let heatProgress = 0;
        if (overchargeTime > heatThreshold) {
          heatProgress = Math.min(
            (overchargeTime - heatThreshold) / (maxHeatTime - heatThreshold),
            1
          );
        }

        const handleCloseWinnerModal = () => {
          if (!winnerRef.current) return; // Prevent multiple triggers using ref for immediate check
          winnerRef.current = null; // Immediately block subsequent calls

          setWinner(null);
          setCoins((prev) => prev + 1); // Earn coins
        };

        const handleRemove = () => {
          // Remove winner logic with animation
          const winnerIndex = items.findIndex((i) => i.text === winner);
          if (winnerIndex !== -1) {
            removingItemRef.current = {
              index: winnerIndex,
              text: winner,
              startTime: Date.now(),
              duration: 750, // 0.75 seconds
            };
            setWinner(null);
          } else {
            // Fallback if not found
            const newItems = items.filter((i) => i.text !== winner);
            setInputText(itemsToString(newItems));
            setWinner(null);
          }

          // Check "One More Time" achievement
          const newUnlocks = achievementManager.check({
            usedRemoveAndSpin: true,
          });
          handleAchievementUnlocks(newUnlocks);
        };

        return (
          // Added md:h-screen and md:overflow-hidden to lock desktop layout to viewport
          <div className="min-h-screen md:h-screen md:overflow-hidden bg-gray-100 dark:bg-gray-900 flex flex-col font-sans text-gray-800 dark:text-gray-100 transition-colors duration-300">
            {/* Header */}
            <header className="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center z-50 border-b dark:border-gray-700 transition-colors duration-300">
              <div className="flex items-center space-x-2">
                <div className="rounded-full overflow-hidden shadow-sm">
                  <SpinWheelLogo size={40} />
                </div>
                <h1 className="text-xl md:text-2xl font-bold text-indigo-900 dark:text-indigo-400">
                  SpinWheel
                </h1>
              </div>
              <div className="flex items-center space-x-2">
                {/* GitHub Link */}
                <a
                  href={GITHUB_LINK}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300"
                  title="View on GitHub"
                >
                  <GithubIcon size={24} />
                </a>

                {/* Theme Dropdown */}
                <div className="relative" ref={themeMenuRef}>
                  <button
                    onClick={() => setShowThemeMenu(!showThemeMenu)}
                    className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400"
                    title="Theme Settings"
                  >
                    <ThemeIcon theme={theme} />
                  </button>

                  {showThemeMenu && (
                    <div className="absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 z-50 overflow-hidden animate-[fade-in_0.2s_ease-out]">
                      <div className="py-1">
                        <button
                          onClick={() => {
                            setTheme(THEMES.AUTO);
                            setShowThemeMenu(false);
                          }}
                          className={`flex items-center w-full px-4 py-2 text-sm text-left ${
                            theme === THEMES.AUTO
                              ? "bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300"
                              : "text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                          }`}
                        >
                          <span className="mr-3">
                            <MonitorIcon size={16} />
                          </span>
                          Auto
                          {theme === THEMES.AUTO && (
                            <span className="ml-auto">
                              <CheckIcon size={16} />
                            </span>
                          )}
                        </button>
                        <button
                          onClick={() => {
                            setTheme(THEMES.LIGHT);
                            setShowThemeMenu(false);
                          }}
                          className={`flex items-center w-full px-4 py-2 text-sm text-left ${
                            theme === THEMES.LIGHT
                              ? "bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300"
                              : "text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                          }`}
                        >
                          <span className="mr-3">
                            <SunIcon size={16} />
                          </span>
                          Light
                          {theme === THEMES.LIGHT && (
                            <span className="ml-auto">
                              <CheckIcon size={16} />
                            </span>
                          )}
                        </button>
                        <button
                          onClick={() => {
                            setTheme(THEMES.DARK);
                            setShowThemeMenu(false);
                          }}
                          className={`flex items-center w-full px-4 py-2 text-sm text-left ${
                            theme === THEMES.DARK
                              ? "bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300"
                              : "text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                          }`}
                        >
                          <span className="mr-3">
                            <MoonIcon size={16} />
                          </span>
                          Dark
                          {theme === THEMES.DARK && (
                            <span className="ml-auto">
                              <CheckIcon size={16} />
                            </span>
                          )}
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* Sound Toggle */}
                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300"
                  title={soundEnabled ? "Mute Sound" : "Enable Sound"}
                >
                  {soundEnabled ? <Volume2Icon size={24} /> : <VolumeXIcon size={24} />}
                </button>

                {/* Settings Menu */}

                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            strokeWidth="4"
                          ></circle>
                          <path
                            className="opacity-75"
                            fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                          ></path>
                        </svg>
                        Generating...
                      </>
                    ) : (
                      <>
                        Generate <SparklesIcon size={16} className="ml-2" />
                      </>
                    )}
                  </button>
                </div>
              }
            >
              <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
                Describe what you want (e.g., "Lunch ideas for Indonesians who wants to lose weight
                but have given up on diet and exercise", "Excuses for being late", "Very spicy truth
                or dare questions").
              </p>
              <textarea
                value={genPrompt}
                onChange={(e) => setGenPrompt(e.target.value)}
                placeholder="Enter a topic..."
                rows={2}
                className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white resize-none"
                onKeyDown={(e) => {
                  if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    generateList();
                  }
                }}
                autoFocus
              />
            </Modal>

            {/* Help Modal */}
            <Modal
              isOpen={showHelpModal}
              onClose={() => setShowHelpModal(false)}
              title="Weighted Items Guide"
              icon={<HelpCircleIcon size={20} />}
              footer={
                <div className="flex justify-end">
                  <button
                    onClick={() => setShowHelpModal(false)}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                  >
                    Got it
                  </button>
                </div>
              }
            >
              <div className="text-sm text-gray-600 dark:text-gray-300 space-y-3">
                <p>
                  You can customize the probability of each item winning by assigning a{" "}
                  <strong>weight</strong>.
                </p>
                <div className="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border border-gray-200 dark:border-gray-600 font-mono text-xs">
                  <p>
                    <span className="text-indigo-600 dark:text-indigo-400">Pizza:10</span>{" "}
                    <span className="text-gray-400">// Very likely (10x chance)</span>
                  </p>
                  <p>
                    <span className="text-indigo-600 dark:text-indigo-400">Burger</span>{" "}
                    <span className="text-gray-400">// Default weight is 1</span>
                  </p>
                </div>
                <ul className="list-disc list-inside space-y-1">
                  <li>
                    Format: <code>Item Name:Weight</code>
                  </li>
                  <li>Higher number = Larger slice on the wheel.</li>
                  <li>
                    If no number is specified, it defaults to <strong>1</strong>.
                  </li>
                </ul>
              </div>
            </Modal>

            {/* API Key Modal */}
            <Modal
              isOpen={showApiKeyModal}
              onClose={() => setShowApiKeyModal(false)}
              title="Gemini API Key"
              icon={<KeyIcon size={20} />}
              footer={
                <div className="flex justify-end space-x-2">
                  <button
                    onClick={() => setShowApiKeyModal(false)}
                    className="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={saveApiKey}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                  >
                    Save Key
                  </button>
                </div>
              }
            >
              <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
                To use AI features like the <strong>List Generator</strong> and{" "}
                <strong>Voice Announcer</strong>, you need a valid Google Gemini API key.
              </p>
              <div className="mb-4">
                <label className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
                  API Key
                </label>
                <input
                  type="password"
                  value={tempApiKey}
                  onChange={(e) => setTempApiKey(e.target.value)}
                  placeholder="Enter your API key here..."
                  className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                  autoFocus
                />
                <p className="text-xs text-gray-400 mt-1">
                  ⚠️️ Your key is stored locally in your browser. Do not use in a shared or public device.
                </p>
              </div>
            </Modal>

            {/* Coin Store Modal */}
            <CoinStoreModal
              isOpen={showCoinStoreModal}
              onClose={() => setShowCoinStoreModal(false)}
              coins={coins}
              xp={xp}
              onTransact={handleCoinSwap}
            />

            {/* OUT OF ORDER OVERLAY */}
            <OutOfOrderOverlay isVisible={isOutOfOrder} />

            {/* Toast Notification */}
            {toastQueue.length > 0 && (
              <Toast
                key={toastQueue[0].id}
                icon={toastQueue[0].icon}
                title={toastQueue[0].title}
                message={toastQueue[0].message}
                duration={toastQueue[0].duration}
                onClose={closeToast}
              />
            )}
          </div>
        );
      };

      const root = createRoot(document.getElementById("root"));
      root.render(<App />);

      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log("SW registered: ", registration);
            })
            .catch((registrationError) => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      }
    </script>
  </body>
</html>
